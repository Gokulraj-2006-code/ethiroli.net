/* ============================================================

   ETHIROLI ÔÇö style.css

   Architecture: ITCSS / 7-1 Layered Pattern

   Property Order: Position ÔåÆ Box Model ÔåÆ Typography ÔåÆ Visuals

   ============================================================ */



/* ============================================================

   1. SETTINGS ÔÇö Design Tokens & Variables

   ============================================================ */

:root {

    /* --- PRIMITIVES (raw values) --- */

    --base-olive: #819E35;

    --base-clay: #AF431E;

    --base-teal: #1A4B48;

    --base-cream: #F1ECE6;

    --base-white: #FFFFFF;

    --base-dark: #0c1a19;

    --base-gold: #E8D657;

    

    /* --- SEMANTIC TOKENS (function) --- */

    --color-primary: var(--base-olive);

    --color-secondary: var(--base-clay);

    --color-accent: var(--base-teal);



    /* Surface & Backgrounds */

    --color-bg-main: var(--base-cream);

    --color-bg-dark: var(--base-dark);

    --color-bg-glass: rgba(255, 255, 255, 0.65);

    --color-bg-card: rgba(255, 255, 255, 0.08);

    --color-surface: var(--base-white);



    /* Text */

    --color-text-main: #2D2D2D;

    --color-text-muted: #555555;

    --color-text-on-primary: var(--base-white);

    --color-text-on-dark: rgba(255, 255, 255, 0.85);



    /* --- TYPOGRAPHY --- */

    --font-display: 'Montserrat', sans-serif;



    /* 'Alice', serif; Active for headings */

    --font-body: 'Montserrat', sans-serif;



    /* Fluid Type Scale (clamp: min, preferred, max) */

    --fs-hero: clamp(3rem, 6vw + 1rem, 6rem);

    --fs-h1: clamp(2rem, 4vw + 0.5rem, 3.5rem);

    --fs-h2: clamp(1.75rem, 3vw + 0.5rem, 2.75rem);

    --fs-h3: clamp(1.25rem, 2vw + 0.5rem, 1.75rem);

    --fs-body: clamp(0.9rem, 1vw + 0.5rem, 1.05rem);

    --fs-small: clamp(0.8rem, 0.8vw + 0.4rem, 0.9rem);



    /* Fluid Spacing */

    --space-section: clamp(60px, 8vw, 120px);

    --space-lg: clamp(2rem, 4vw, 4rem);

    --space-md: clamp(1rem, 2vw, 2rem);

    --space-sm: clamp(0.5rem, 1vw, 1rem);



    /* --- GLASSMORPHISM SYSTEM --- */

    --glass-blur: 12px;

    --glass-bg: rgba(255, 255, 255, 0.08);

    --glass-border: 1px solid rgba(255, 255, 255, 0.15);

    --glass-shadow: 0 8px 32px rgba(26, 75, 72, 0.1);



    /* --- FUNCTIONAL --- */

    --radius-xl: 1.5rem;

    --radius-lg: 1rem;

    --radius-md: 0.75rem;

    --radius-sm: 0.5rem;

    --transition-smooth: 0.4s cubic-bezier(0.25, 1, 0.5, 1);

    --transition-fast: 0.25s ease;

    --header-height: 100px;

    --container-width: 1400px;



    /* Overlay */

    --overlay-color: rgba(12, 26, 25, 0.55);

}





/* ============================================================

   2. GENERIC ÔÇö Reset & Normalize

   ============================================================ */

*,

*::before,

*::after {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

}



html {

    scroll-behavior: smooth;

    /* Senior Tip: Prevents sticky header from covering section anchors */

    scroll-padding-top: var(--header-height);

    -webkit-font-smoothing: antialiased;

    -moz-osx-font-smoothing: grayscale;

}



/* Scrollbar */

::-webkit-scrollbar {

    width: 7px;

}



::-webkit-scrollbar-track {

    background: rgba(0, 0, 0, 1);



}



::-webkit-scrollbar-thumb {

    background: var(--color-primary);

    /* border-radius: 9px; */

}





/* ============================================================

   3. ELEMENTS ÔÇö Bare HTML Tags (unclassed)

   ============================================================ */

body {

    background-color: var(--color-bg-main);

    font-family: var(--font-body);

    font-size: var(--fs-body);

    color: var(--color-text-main);

    line-height: 1.6;

    overflow-x: hidden;

}



h1,

h2,

h3,

h4 {

    font-family: var(--font-display);

    color: var(--color-accent);

    line-height: 1.2;

}



h1 { font-size: var(--fs-h1); }

h2 { font-size: var(--fs-h2); }

h3 { font-size: var(--fs-h3); }



p {

    font-size: var(--fs-body);

    line-height: 1.7;

}



a {

    text-decoration: none;

    color: inherit;

    transition: color var(--transition-fast);

}



ul { list-style: none; }



img {

    max-width: 100%;

    display: block;

}



header {

    position: relative;

    /* height: 100vh; */

    width: 100%;

}



section {

    padding: var(--space-md) 5%;

}



button {

    font-family: var(--font-body);

    cursor: pointer;

}



input,

textarea {

    font-family: var(--font-body);

    font-size: var(--fs-body);

    border: 1px solid rgba(43, 45, 45, 0.2);

    /* border-radius: var(--radius-sm); */

    padding: 0.85rem 1.2rem;

    background: var(--color-surface);

    color: var(--color-text-main);

    outline: none;

    transition: border-color var(--transition-fast);

    width: 100%;

}



input:focus,

textarea:focus { border-color: var(--color-primary); }



textarea {

    resize: vertical;

    min-height: 120px;

}



blockquote {

    font-style: italic;

    line-height: 1.8;

}



video { display: block; }





/* ============================================================

   4. OBJECTS ÔÇö Layout Containers & Grid Systems

   ============================================================ */



/* Shared container pattern */

.nav-container {

    display: flex;

    justify-content: space-between;

    align-items: center;

    width: 90%;

    max-width: var(--container-width);

    margin: 0 auto;

}



/* Services grid ÔÇö auto-wrapping columns */

.et-services-grid {

    display: grid;

    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));

    gap: var(--space-md);

}







/* About section ÔÇö 2-column layout */











/* ============================================================

   5. COMPONENTS

   ============================================================ */



/* ----------------------------------------------------------

   5a. PRELOADER

   ---------------------------------------------------------- */

#preloader {

    position: fixed;

    inset: 0;

    z-index: 9999;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 1.5rem;

    background: var(--color-bg-main);

    opacity: 1;

    transition: opacity 0.5s ease;

}



.et-preloader-text {

    font-family: var(--font-display);

    font-size: var(--fs-h3);

    color: var(--color-accent);

    letter-spacing: 3px;

}



.loading-animation {

    width: 200px;

    height: 3px;

    background: rgba(26, 75, 72, 0.15);

    border-radius: 4px;

    overflow: hidden;

}



.loading-animation-bar {

    width: 40%;

    height: 100%;

    background: linear-gradient(90deg, var(--color-primary), var(--color-secondary));

    border-radius: 4px;

    animation: preloaderSlide 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;

    will-change: transform;

}



@keyframes preloaderSlide {

    0% { transform: translateX(-100%); }

    100% { transform: translateX(500%); }

}





/* ----------------------------------------------------------

   5b. NAVIGATION

   ---------------------------------------------------------- */

.main-nav {

    position: fixed;

    top: 0;

    left: 0;

    width: 100%;

    height: var(--header-height);

    z-index: 1000;

    display: flex;

    align-items: center;

    transition: transform 0.3s ease, background 0.3s ease;

}



.main-nav.scrolled {

    background: rgba(241, 236, 230, 0.2);

    backdrop-filter: blur(20px);

    -webkit-backdrop-filter: blur(10px);

    box-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);

}



.logo {

    display: flex;

    align-items: center;

    gap: 0.5rem;

    font-family: var(--font-display);

    font-size: 1.8rem;

    font-weight: bold;

    color: var(--color-accent);

}



.logo img {

    height: 100px;

    width: 100px;

    object-fit: contain;

}



.nav-links {

    display: flex;

    gap: 2rem;

}



.nav-links a {

    position: relative;

    font-weight: 500;

    font-size: 0.95rem;

    color: var(--base-white);

}



.nav-links a::after {

    content: '';

    position: absolute;

    bottom: -5px;

    left: 0;

    width: 0;

    height: 2px;

    background: var(--color-primary);

    transition: width 0.3s ease;

    will-change: width;

}



.nav-links a:hover::after { width: 100%; }



/* Shared button style */

.btn {

    display: inline-block;

    background-color: var(--color-secondary);

    color: var(--color-text-on-primary);

    padding: 0.6rem 1.4rem;

    border-radius: var(--radius-lg);

    border: none;

    font-weight: 600;

    font-size: 0.95rem;

    cursor: pointer;

    transition: transform var(--transition-fast), background-color var(--transition-fast), box-shadow var(--transition-fast);

    will-change: transform;

}



.btn:hover {

    background-color: var(--color-primary);

    transform: translateY(-2px);

    box-shadow: 0 8px 24px rgba(129, 158, 53, 0.25);

}



/* Nav actions (button + hamburger) */

.nav-actions {

    display: flex;

    gap: 1rem;

    align-items: center;

}



/* Hamburger Icon */

        .hamburger {

            width: 30px;

            height: 24px;

            display: none; /* Hidden on desktop */

            flex-direction: column;

            justify-content: space-between;

            z-index: 1002;

            background-color: transparent;

                border: none;

                cursor: pointer;

        }



        .hamburger span {

            display: block;

            width: 100%;

            height: 2px;

            background-color: var(--base-olive);

            transition: all 0.3s ease;

            border-radius: 2px;

        }



        /* Hamburger to Close Animation */

        .hamburger.open span:nth-child(1) {

            transform: rotate(45deg) translate(5px, 6px);

        }

        .hamburger.open span:nth-child(2) {

            opacity: 0;

        }

        .hamburger.open span:nth-child(3) {

            transform: rotate(-45deg) translate(5px, -6px);

        }



        /* Mobile Menu */

        .mobile-menu {

            position: fixed;

            top: 0; right: 0;

            width: 70%;

            max-width: 300px;

            height: 100vh;

            background-color: rgba(241, 236, 230, 0.9);

            backdrop-filter: blur(15px);

            -webkit-backdrop-filter: blur(15px);

            z-index: 1001;

            transform: translateX(100%);

            transition: transform 0.5s cubic-bezier(0.77, 0, 0.175, 1);

            padding: 100px 2rem;

            box-shadow: -5px 0 15px rgba(0,0,0,0.05);

        }



        .mobile-menu.active {

            transform: translateX(0);

        }



        .mobile-menu ul li {

            margin-bottom: 2rem;

        }



        .mobile-menu a {

            font-family: var(--font-display);

            font-size: 1.5rem;

            color: var(--base-dark);

        }



/* ----------------------------------------------------------

   5c. HERO SECTION

   ---------------------------------------------------------- */

.et-hero-section {

    position: relative;

    width: 100%;

    height: 100%;

    overflow: hidden;

}



.bg-video {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    object-fit: cover;

}



.video-overlay {

    position: absolute;

    inset: 0;

    background: var(--overlay-color);

    background-image: radial-gradient(circle, transparent 20%, var(--overlay-color) 80%);

}



.video-content {

    position: relative;

    z-index: 1;

    display: flex;

    flex-direction: column;

    justify-content: center;

    height: 100vh;

    width: 100%;

}



.video-content p {

    /* padding-left: 5%; */

    margin-bottom: -40px;

    font-family: var(--font-body);

    font-size: clamp(60px, 1.2vw, 18px);

    font-weight: 600;

    color: var(--color-primary);

    letter-spacing: 6px;

    text-transform: uppercase;

    padding: 0;

}



.video-content h1 {

        margin-top: -10px;



    font-size: var(--fs-hero);

    color: var(--base-white);

    letter-spacing: 8px;

    line-height: 1.05;

    font-size: clamp(100px, 14vw, 270px);

    padding: 0;

}





/* ----------------------------------------------------------

   5d. SERVICES MARQUEE

   ---------------------------------------------------------- */

/* MARQUEE SECTION */

.et-services-marquee {

  width: 100%;

  overflow: hidden;

  padding: 25px 0;

  position: relative;

  cursor: pointer;

  background-color: var(--color-primary);

}



/* Track */

.et-marquee-track {

  display: flex;

  align-items: center;

  gap: 60px;

  will-change: transform;

  width: max-content;

  animation: etMarqueeScroll 20s linear infinite;

}



/* Items */

.et-marquee-item {

  display: flex;

  align-items: center;

  white-space: nowrap;

  font-size: 22px;

  font-weight: 600;

  color: #fff;

}



/* Star between items */

.et-marquee-item:not(:last-child)::after {

  content: "Ôÿà";

  margin-left: 60px;

  font-size: 20px;

  color: #fff;

}





@keyframes etMarqueeScroll {

  0% {

    transform: translateX(0);

  }

  100% {

    transform: translateX(-50%);

  }

}



/* ----------------------------------------------------------

   5e. ABOUT SECTION

   ---------------------------------------------------------- */

   /* ========== SECTION ========== */



.et-about-section {

    padding: 100px 8%;

    background: #fafafa;

}



.et-container {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 80px;

    flex-wrap: wrap;

}



/* ========== LEFT IMAGES ========== */



.et-about-media {

    flex: 1;

    display: flex;

    justify-content: center;

}



.et-about-images-wrapper {

    position: relative;

}

    border-radius: 0;

        left: -40px;

    box-shadow: 0 15px 30px rgba(0,0,0,0.15);

}

/* ----------------------------------------------------------

   5f. SERVICES SECTION

   ---------------------------------------------------------- */

.et-services-section {

    background: var(--color-bg-main);

    position: relative;

    overflow: hidden;

}



.et-services-section::before {

    content: '';

    position: absolute;

    inset: 0;

    background: radial-gradient(circle at 12% 20%, rgba(129, 158, 53, 0.12), transparent 55%),

        radial-gradient(circle at 85% 15%, rgba(175, 67, 30, 0.12), transparent 52%);

    pointer-events: none;

    z-index: 0;

}



.et-services-section > * {

    position: relative;

    z-index: 1;

}



.et-services-slider-wrapper {

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 12px;

    padding: 0 64px;

}



.et-services-slider {

    --services-gap: 22px;

    --visible-slides: 2;

    --current-index: 0;

    --slide-size: calc((100% - (var(--services-gap) * (var(--visible-slides) - 1))) / var(--visible-slides));

    width: min(100%, 1200px);

    overflow: hidden;

    padding: 12px 10px 18px;

    /* border-radius: calc(var(--radius-xl) + 6px); */

    

    /* background: linear-gradient(140deg, rgba(255, 255, 255, 0.85), rgba(241, 236, 230, 0.7)); */

    /* border: 1px solid rgba(26, 75, 72, 0.08); */

    /* box-shadow: 0 20px 55px rgba(12, 26, 25, 0.12); */

}



.et-services-track {

    display: flex;

    gap: var(--services-gap);

    transform: translateX(calc(-1 * var(--current-index) * (var(--slide-size) + var(--services-gap))));

    transition: transform 0.55s cubic-bezier(0.25, 1, 0.5, 1);

    will-change: transform;

}



.et-services-slide {

    flex: 0 0 var(--slide-size);

    background: var(--base-clay);

    min-width: 0;

    border-radius: var(--radius-lg);

    padding: 0 4px;

    transition: transform var(--transition-fast);

}



.et-services-slide.active {

    transform: translateY(-6px);

}



.et-services-slide.active .et-glass-card {

    /* box-shadow: 0 18px 42px rgba(26, 75, 72, 0.18); */

    /* border-color: rgba(26, 75, 72, 0.2); */

}



.et-services-nav {

    width: 46px;

    height: 46px;

    border-radius: 50%;

    border: 1px solid var(--base-olive);

    background: rgba(255, 255, 255, 0.95);

    color: var(--color-accent);

    display: inline-flex;

    align-items: center;

    justify-content: center;

    font-size: 0.95rem;

    transition: transform var(--transition-fast), background-color var(--transition-fast), color var(--transition-fast), box-shadow var(--transition-fast);

    position: absolute;

    top: 50%;

    transform: translateY(-50%);

    box-shadow: 0 10px 24px rgba(12, 26, 25, 0.12);

}



.et-services-nav.et-services-nav-prev { left: 0; }

.et-services-nav.et-services-nav-next { right: 0; }



.et-services-nav:hover {

    transform: translateY(-50%) scale(1.03);

    background: var(--color-accent);

    color: var(--base-white);

}



.et-services-nav:focus-visible {

    outline: 2px solid rgba(26, 75, 72, 0.35);

    outline-offset: 3px;

}



.et-services-dots {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 10px;

    margin-top: var(--space-md);

}



.et-services-dot {

    width: 12px;

    height: 12px;

    border-radius: 999px;

    border: none;

    background-color: rgba(26, 75, 72, 0.25);

    transition: width var(--transition-fast), background-color var(--transition-fast), transform var(--transition-fast);

}



.et-services-dot:hover {

    transform: translateY(-1px);

}



.et-services-dot.active {

    width: 32px;

    background-color: var(--color-primary);

    /* background: linear-gradient(0deg, var(--color-primary), var(--color-secondary)); */

}

.et-services-label p {

    display: flex;

    align-items: center;

    gap: 0.5rem;

    font-size: var(--fs-small);

    font-weight: 600;

    color: var(--color-primary);

    text-transform: uppercase;

    letter-spacing: 2px;

    margin-bottom: var(--space-sm);

}



.et-services-label i,

.et-services-label .star-rotate {

    display: inline-block;

    animation: spinIcon 4s linear infinite;

    will-change: transform;

}



@keyframes spinIcon {

    0% { transform: rotate(0deg); }

    100% { transform: rotate(360deg); }

}



.et-services-intro {

    display: flex;

    justify-content: space-between;

    align-items: flex-end;

    gap: var(--space-md);

    margin-bottom: var(--space-lg);

}



.et-services-intro h3 {

    max-width: 600px;

    color: var(--color-accent);

}



.et-services-intro button {

    flex-shrink: 0;

    background: var(--color-secondary);

    color: var(--color-text-on-primary);

    padding: 0.75rem 2rem;

    border: none;

    border-radius: var(--radius-lg);

    font-weight: 600;

    transition: transform var(--transition-fast), background-color var(--transition-fast);

    will-change: transform;

}



.et-services-intro button:hover {

    background: var(--color-primary);

    transform: translateY(-2px);

}



.et-services { position: relative; }



/* Glass Card ÔÇö the signature component */

.et-glass-card {

    position: relative;

    padding: var(--space-md);

    background: var(--color-bg-card);

    backdrop-filter: blur(var(--glass-blur));

    -webkit-backdrop-filter: blur(var(--glass-blur));

    border: var(--glass-border);

    border-radius: var(--radius-xl);

    /* box-shadow: var(--glass-shadow); */

    transition: transform var(--transition-smooth), box-shadow var(--transition-smooth);

    will-change: transform;

    overflow: hidden;

    background-color: var(--color-primary);

    width: 100%;

    height:550px;

    margin: 10px;

}



.et-glass-card::before {

    content: '';

    position: absolute;

    inset: 0;

    border-radius: var(--radius-xl);

    padding: 1px;

    /* background: linear-gradient(120deg, rgba(129, 158, 53, 0), rgba(111, 114, 104, 0.65), rgba(175, 67, 30, 0.65), rgba(129, 158, 53, 0)); */

    background-size: 220% 220%;

    -webkit-mask-composite: xor;

    mask-composite: exclude;

    opacity: 0;

    transition: opacity var(--transition-fast);

    pointer-events: none;

}



.et-glass-card:hover {

    transform: translateY(-6px);

    box-shadow: 0 16px 48px rgba(26, 75, 72, 0.15);

}



.et-glass-card:hover::before {

    opacity: 1;

    animation: cardBorderRun 1.6s linear infinite;

}



@keyframes cardBorderRun {

    0% { background-position: 0% 50%; }

    100% { background-position: 200% 50%; }

}



.et-glass-card .media {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: var(--space-md);

}



.et-glass-card .media img {

    width: 156px;

    /* height: 56px; */

    margin: -50px;

    object-fit: contain;

    transition: transform var(--transition-smooth);

    will-change: transform;

}



.et-glass-card:hover .media img { transform: rotateY(180deg); }



.et-glass-card .media .desc {

    font-family: var(--font-display);

    font-size: var(--fs-h1);

    font-weight: 700;

    color: var(--color-bg-glass);

    transition: color var(--transition-smooth);

}



.et-glass-card:hover .media .desc { color: var(--color-primary); }



.et-glass-card .title h3 {

    font-size: var(--fs-h3);

    margin-bottom: var(--space-sm);

}



.thumb-wrapper {

    overflow: visible;

    border-radius: var(--radius-md);

    position: relative;

    /* background: rgba(255, 255, 255, 0.7); */

    /* border: 1px solid rgba(26, 75, 72, 0.08); */

    padding: 0.9rem 1rem;

    /* min-height: 170px; */

}



.thumb-wrapper div {

    overflow: hidden;

    border-radius: var(--radius-md);

}



.thumb-wrapper p {

    margin: 0;

    /* text-align: justify; */

    color: var(--base-white);

    font-size: var(--fs-body);

    line-height: 1.6;

}



/* .thumb-wrapper img {

    width: 100%;

    aspect-ratio: 16 / 10;

    object-fit: cover;

    transition: transform var(--transition-smooth);

    will-change: transform;

} */



.et-glass-card:hover .thumb-wrapper img { transform: scale(1.05); }



/* Light reflection on hover */

.thumb-wrapper::after {

    content: '';

    position: absolute;

    top: 0;

    left: -100%;

    width: 60%;

    height: 100%;

    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);

    transition: left 0.6s ease;

    pointer-events: none;

}



.et-glass-card:hover .thumb-wrapper::after { left: 120%; }

.et-projects-header > p:first-child {

.et-project-link {

.project-home-page {

.project-home-search span,

.project-home-search input,

.project-home-sort-buttons {

.project-home-sort-buttons button {

.project-home-meta {

.project-home-empty {

   5h. PROJECT DETAIL PAGE

   ---------------------------------------------------------- */

.event-detail {

}



.event-hero {

.event-gallery-item {

/* ----------------------------------------------------------

   5g. CONSULTATION SECTION

   ---------------------------------------------------------- */

   

/* consultationSECTION */

.et-consultation-section {



    min-height: 50vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: var(--space-section) 2%;

    gap: 80px;

    background-size: cover;

    position: relative;

    overflow: hidden;

}



/* LEFT FORM CARD */

.et-consultation-form-wrapper {

    background: var(--color-secondary);

    padding: 60px 50px;

    border-radius: 40px;

    width: 480px;

    color: var(--color-text-main);

    box-shadow: var(--glass-shadow);

    z-index: 1;

    position: relative;

    transition: transform var(--transition-smooth);

}



.et-consultation-form-wrapper:hover {

    transform: translateY(-5px);

}



.et-consultation-form-wrapper h1 {

    font-size: 32px;

    margin-bottom: 15px;

    font-weight: 700;

    line-height: 1.2;

    color: #fff; 

}



.et-consultation-form-wrapper p {

    font-size: 15px;

    margin-bottom: 40px;

    line-height: 1.6;

    color: var(--base-white);

}



/* FORM */

.et-consultation-form {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 25px;

}



.et-consultation-form input,

.et-consultation-form textarea {

    border: none;

    border-bottom: 1px solid rgba(0, 0, 0, 0.2);

    background: transparent;

    padding: 12px 0;

    font-size: 14px;

    outline: none;

    color: var(--color-text-main);

    font-family: var(--font-body);

    color: var(--base-white);

}



.et-consultation-form input::placeholder,

.et-consultation-form textarea::placeholder {

    color: var(--base-white);

}



.et-consultation-form input:focus,

.et-consultation-form textarea:focus {

    border-bottom-color: var(--color-bg-dark);

}



.et-consultation-form textarea {

    grid-column: 1 / -1;

    height: 80px;

    resize: none;

}



.et-consultation-form button {

    grid-column: 1 / -1;

    margin-top: 25px;

    padding: 16px;

    border: none;

    border-radius: 40px;

    background: var(--color-bg-dark); 

    color: var(--color-surface);

    font-weight: 600;

    cursor: pointer;

    /* transition: background-color var(--transition-fast), transform 0.2s ease, box-shadow 0.2s ease; */

    letter-spacing: 0.5px;

}



.et-consultation-form button:hover {

    background: #1a2e38; 

    transform: scale(1.02);

    box-shadow: 0 5px 15px rgba(0,0,0,0.2);

}



.et-consultation-form button:active {

    transform: scale(0.98);

}



/* RIGHT SIDE */

.contact-info {

    max-width: 550px;

    z-index: 1;

    display: flex;

    flex-direction: column;

}



.contact-info p {

    color: var(--color-secondary); 

    font-weight: 600;

    margin-bottom: 20px;

    text-transform: uppercase;

    letter-spacing: 1px;

    font-size: var(--fs-small);

    display: flex;

    align-items: center;

    gap: 8px;

}



/* --- STAR ROTATION ANIMATION --- */

.star-rotate {

    display: inline-block;

    animation: spin 4s linear infinite;

    font-size: 1.2em; /* Slightly larger star */

}



@keyframes spin {

    from { transform: rotate(0deg); }

    to { transform: rotate(360deg); }

}



/* --- H1 CONTINUOUS SCROLL ANIMATION --- */



.contact-info h1 {

    font-size: var(--fs-h1);

    line-height: 1.3;

    font-weight: 600;

    color: var(--color-surface);

    margin: 0;

    

    /* Animation applied */

    animation: scrollUp 12s linear infinite;

}







.contact-item {

    display: flex;

    flex-direction: column;

    gap: 10px;

    margin-bottom: 30px;

}



.contact-item a {

    color: rgba(255,255,255, 0.7);

    text-decoration: none;

    font-size: 18px;

    transition: color var(--transition-fast);

    display: flex;

    align-items: center;

    gap: 10px;

}



.contact-item a:hover {

    color: var(--color-secondary); 

}



.contact-info button {

    padding: 14px 30px;

    border-radius: 30px;

    border: 1px solid var(--color-secondary); 

    background: transparent;

    color: var(--color-secondary); 

    font-weight: 600;

    cursor: pointer;

    transition: var(--transition-fast);

    align-self: flex-start;

}



.contact-info button:hover {

    background: var(--color-secondary); 

    color: var(--color-bg-dark); 

}



/* TOAST NOTIFICATION */

.toast {

    position: fixed;

    bottom: 30px;

    right: 30px;

    background: var(--base-white);

    color: var(--color-text-main);

    padding: 20px 25px;

    border-radius: var(--radius-md);

    box-shadow: 0 10px 30px rgba(0,0,0,0.3);

    display: flex;

    align-items: center;

    gap: 15px;

    transform: translateY(150%);

    transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);

    z-index: 1000;

    border-left: 5px solid var(--color-primary); 

}



.toast.show {

    transform: translateY(0);

}



.toast-icon {

    color: var(--color-primary); 

    font-size: 20px;

}



/* RESPONSIVE */

@media (max-width: 992px) {

    .et-consultation-section {

        flex-direction: column;

        text-align: center;

        padding-top: 40px;

        padding-bottom: 40px;

    }



    .et-consultation-form-wrapper {

        width: 100%;

        max-width: 500px;

    }

    

    .contact-info {

        align-items: center;

        width: 100%;

    }



    .contact-info button {

        align-self: center;

    }



    .contact-item {

        align-items: center;

    }

}



/* Mobile Fix for Text Marquee */

@media (max-width: 768px) {

    .h1-wrapper {

        height: auto;

        overflow: visible;

        margin-bottom: 20px;

    }

    

    .contact-info h1 {

        /* Disable animation on mobile to allow natural text wrapping */

        animation: none; 

        white-space: normal; /* Allow wrapping */

        font-size: clamp(1.8rem, 5vw, 2.5rem); /* Slightly smaller on mobile */

    }

}

.et-cta-btn {

.et-cta-btn:hover {

    transform: translateY(-2px);

    /* box-shadow: 0 14px 26px rgba(232, 214, 87, 0.36); */

/* ----------------------------------------------------------

   5i. TESTIMONIAL SECTION (Vertical Content Swap Logic)

   ---------------------------------------------------------- */

.glass-card {

            background: var(--color-bg-glass);

            backdrop-filter: blur(var(--glass-blur));

            -webkit-backdrop-filter: blur(var(--glass-blur));

            border: var(--glass-border);

            box-shadow: var(--glass-shadow);

            border-radius: var(--radius-xl);

        }



        .testimonial-container {

            max-width: var(--container-width);

            margin: 0 auto;

        }



        /* Header Group */

        .testimonial-header {

            display: flex;

            justify-content: space-between;

            align-items: flex-end;

            margin-bottom: var(--space-lg);

            flex-wrap: wrap;

            gap: var(--space-sm);

        }



        .testimonial-title {

            position: relative;

            padding-bottom: 10px;

        }



        .testimonial-title::after {

            content: '';

            position: absolute;

            bottom: 0;

            left: 0;

            width: 60px;

            height: 3px;

            background-color: var(--color-secondary);

            border-radius: 2px;

        }



        .testimonial-stats {

            font-weight: 600;

            color: var(--color-text-muted);

            display: flex;

            align-items: center;

            gap: 8px;

            font-size: var(--fs-h3);

        }



        /* Grid Layout */

        .testimonial-grid {

            display: grid;

            grid-template-columns: 1fr 1.4fr; /* Left col smaller, right col larger */

            gap: var(--space-lg);

            align-items: center;

        }



        /* Left Column: Visuals */

        .testimonial-visual {

            display: flex;

            flex-direction: column;

            gap: var(--space-md);

            align-items: center;

        }



        .visual-badge {

            padding: var(--space-md);

            text-align: center;

            max-width: 350px;

            transition: transform var(--transition-fast);

        }



        .visual-badge:hover {

            transform: translateY(-5px);

        }



        .visual-badge img {

            border-radius: var(--radius-md);

            margin-bottom: var(--space-sm);

            width: 100%;

            height: auto;

            object-fit: cover;

        }



        .visual-badge p {

            font-family: var(--font-display);

            font-size: 1.25rem;

            color: var(--color-accent);

        }



        /* Right Column: Slider */

        .testimonial-content {

            position: relative;

            min-height: 450px; /* Ensure space for absolute elements if needed */

        }



        .content-heading {

            margin-bottom: var(--space-md);

        }



        /* The Slider Wrapper */

        .testimonial-slider {

            position: relative;

        }



        .testimonial-card {

            padding: var(--space-sm);

            position: relative;

            background: rgba(255, 255, 255, 0.75); /* Slightly stronger opacity for readability */

            overflow: hidden; /* Contains animations */

        }



        /* Animation Wrapper */

        .card-content-wrapper {

            height: 100%;

            display: flex;

            flex-direction: column;

            transition: transform 0.5s ease, opacity 0.5s ease;

        }



        /* Animation States */

        .card-content-wrapper.slide-out-up {

            transform: translateY(-20px);

            opacity: 0;

        }

        

        .card-content-wrapper.slide-in-up {

            animation: slideIn 0.5s ease forwards;

        }



        @keyframes slideIn {

            from {

                transform: translateY(20px);

                opacity: 0;

            }

            to {

                transform: translateY(0);

                opacity: 1;

            }

        }



        /* Card Inner Elements */

        .card-top {

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            margin-bottom: var(--space-sm);

        }



        .star-rating {

            font-size: 1.2rem;

            color: #FFC107;

            letter-spacing: 2px;

        }



        .quote-icon {

            font-family: var(--font-display);

            font-size: 4rem;

            line-height: 1;

            color: var(--color-primary);

            opacity: 1.6;

        }



        .testimonial-text {

            font-family: var(--font-body);

            font-size: 1.1rem;

            color: var(--color-text-main);

            margin-bottom: var(--space-lg);

            border-left: 3px solid var(--color-secondary);

            padding-left: var(--space-md);

            flex-grow: 1; /* Pushes footer to bottom */

        }



        .testimonial-footer {

            margin-top: auto;

            display: flex;

            justify-content: space-between;

        }



        .client-info {

            display: flex;

            align-items: center;

            gap: var(--space-md);

        }



        .client-avatar {

            width: 64px;

            height: 64px;

            border-radius: 50%;

            object-fit: cover;

            border: 2px solid var(--color-primary);

        }



        /* Container for Name, Role, and Controls */

        .client-details {

            display: flex;

            flex-direction: column;

            gap: 4px; /* Tight gap between name and role */

        }



        .client-name {

            font-weight: 700;

            color: var(--color-accent);

            font-size: 1.1rem;

        }



        .client-role {

            font-size: 0.9rem;

            color: var(--color-text-muted);

        }



        /* Controls Styled to sit below text */

        .slider-controls-inline {

            display: flex;

            gap: 12px;

            margin-top: 8px; /* Space between role and controls */

        }



        .control-btn {

            width: 36px;

            height: 36px;

            border-radius: 50%;

            background: var(--color-accent);

            color: white;

            border: none;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 1rem;

            transition: var(--transition-fast);

            box-shadow: 0 2px 8px rgba(26, 75, 72, 0.2);

        }



        .control-btn:hover {

            background: var(--color-primary);

            transform: translateY(-2px);

        }



        



        /* ============================================================

           5. RESPONSIVE

           ============================================================ */

                grid-template-columns: 1fr;

            }

/* --- ANIMATION CLASSES (The "Shutter" Logic) --- */



/* 1. Slide Out (Moving Up) */

.slide-out-up {

    transform: translateY(-100%);

    opacity: 0;

}



/* 2. Slide In (From Bottom) */

.slide-in-from-bottom {

    animation: slideUp var(--transition-smooth) forwards;

}



/* 3. Slide Out (Moving Down) */

.slide-out-down {

    transform: translateY(100%);

    opacity: 0;

}



/* 4. Slide In (From Top) */

.slide-in-from-top {

    animation: slideDown var(--transition-smooth) forwards;

}



@keyframes slideUp {

    from { transform: translateY(100%); opacity: 0; }

    to { transform: translateY(0); opacity: 1; }

}



@keyframes slideDown {

    from { transform: translateY(-100%); opacity: 0; }

    to { transform: translateY(0); opacity: 1; }

}





/* Scroll To Top Button */

.scroll-to-top {

    position: fixed;

    bottom: 100px;

    right: 25px;

    width: 60px;

    height: 60px;

    background-color: #333;

    color: #ffffff;

    border: none;

    border-radius: 50%;

    cursor: pointer;

    z-index: 1000;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 18px;

    opacity: 0;

    visibility: hidden;

    transform: translateY(20px);

    transition: all 0.4s ease;

    box-shadow: 0 4px 10px rgba(0,0,0,0.2);

}



.scroll-to-top.show {

    opacity: 1;

    visibility: visible;

    transform: translateY(0);

}



.scroll-to-top:hover {

    background-color: #000;

    transform: translateY(-5px);

}



/* WhatsApp Button */

.whatsapp-floating-btn {

    position: fixed;

    bottom: 30px;

    right: 25px;

    width: 60px;

    height: 60px;

    background-color: #25D366;

    color: #ffffff;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 30px;

    text-decoration: none;

    z-index: 1000;

    box-shadow: 0 6px 15px rgba(37, 211, 102, 0.4);

    transition: transform 0.3s ease;

    animation: pulse 2s infinite;

}



.whatsapp-floating-btn:hover {

    transform: scale(1.1);

}



/* Tooltip */

.tooltip {

    position: absolute;

    right: 75px;

    background-color: #333;

    color: #ffffff;

    padding: 8px 16px;

    border-radius: 6px;

    font-size: 13px;

    font-weight: 500;

    white-space: nowrap;

    opacity: 0;

    visibility: hidden;

    transform: translateX(10px);

    transition: all 0.3s ease;

    pointer-events: none;

}



.whatsapp-floating-btn:hover .tooltip {

    opacity: 1;

    visibility: visible;

    transform: translateX(0);

}



/* Pulse Animation */

@keyframes pulse {

    0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }

    70% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }

    100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }

}





/* Responsive */

@media (max-width: 600px) {

    .scroll-to-top {

        width: 42px;

        height: 42px;

        font-size: 15px;

        bottom: 20px;

        right: 16px;

    }



    .whatsapp-floating-btn {

        width: 48px;

        height: 48px;

        font-size: 22px;

        bottom: 18px;

        right: 16px;

        box-shadow: 0 4px 12px rgba(37, 211, 102, 0.35);

    }



    .whatsapp-floating-btn .tooltip {

        display: none;

    }

}



@media (max-width: 400px) {

    .whatsapp-floating-btn {

        width: 44px;

        height: 44px;

        font-size: 20px;

        bottom: 14px;

        right: 14px;

    }

}

.ab-card-premium h3 {

/* Leadership Section (Zig-Zag Layout) */

.ab-leadership {

    position: relative;

    overflow: hidden;

}



.ab-leadership .ab-title-center {

    text-align: center;

    margin-bottom: clamp(28px, 4vw, 48px);

}



.ab-leadership-subtitle {

}



.ab-leadership .ab-card-grid-two {

    flex-direction: column;

    gap: clamp(40px, 6vw, 80px);

    max-width: 1080px;

    margin: 0 auto;

}



.ab-leadership .leader-wrapper {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: clamp(30px, 4vw, 60px);

    align-items: center;

    position: relative;

}



.ab-leadership .leader-wrapper:nth-child(even) .leader-visual {

    order: 2;

}



.ab-leadership .leader-wrapper:nth-child(even) .ab-leader-card {

    order: 1;

}



.ab-leadership .leader-visual {

    position: relative;

    border-radius: 24px;

    overflow: hidden;

    box-shadow: 0 20px 50px rgba(12, 26, 25, 0.15);

    aspect-ratio: 4/5;

    transform: translateZ(0);

}



.ab-leadership .leader-visual::after {

    content: "";

    position: absolute;

    inset: 0;

    border: 1px solid rgba(255, 255, 255, 0.35);

    border-radius: inherit;

    pointer-events: none;

}



.ab-leadership .leader-visual img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    transition: transform 0.6s ease;

}



.ab-leadership .leader-wrapper:hover .leader-visual img {

    transform: scale(1.03);

}



.ab-leadership .leader-overlay {

    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content:flex-end;

    gap: 8px;

    color: #fff;

    /* text-align: center; */

    padding: 20px;

    opacity: 0;

    transform: translateY(10px);

    background: linear-gradient(180deg, rgba(10, 20, 30, 0.1), rgba(10, 20, 30, 0.25));

    transition: all 0.4s ease;

}



.ab-leadership .leader-wrapper:hover .leader-overlay {

    opacity: 1;

    transform: translateY(0);

}



.ab-leadership .leader-wrapper:focus-within .leader-overlay {

    opacity: 1;

    transform: translateY(0);

}



.ab-leadership .leader-overlay h3 {

    color: #fff;

    font-size: 1.5rem;

    margin-bottom: 0;

    font-family: var(--font-serif, var(--font-display));

}



.ab-leadership .leader-overlay p {

    color: rgba(255, 255, 255, 0.9);

    text-transform: uppercase;

    letter-spacing: 1px;

    font-size: 0.9rem;

}



.ab-leadership .leader-overlay a {

    width: 45px;

    height: 45px;

    border-radius: 50%;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    background: rgba(255, 255, 255, 0.2);

    backdrop-filter: blur(5px);

    border: 1px solid rgba(255, 255, 255, 0.3);

    color: #fff;

    transition: 0.3s;

    margin-top: 10px;

}



.ab-leadership .leader-overlay a:hover {

    background: var(--color-secondary);

    transform: scale(1.1);

}



.ab-leadership .ab-leader-card {

    background: linear-gradient(145deg, rgba(255, 255, 255, 0.95), rgba(232, 225, 214, 0.9));

    border: 1px solid rgba(255, 255, 255, 0.6);

    border-radius: 22px;

    box-shadow: 0 10px 30px rgba(12, 26, 25, 0.08);

    padding: clamp(2rem, 4vw, 3.5rem);

    transition: transform 0.3s ease, box-shadow 0.3s ease;

    position: relative;

    z-index: 2;

}



.ab-leadership .ab-leader-card strong {

    color: var(--color-accent);

}



.ab-leadership .ab-leader-card::before {

    content: "";

    position: absolute;

    top: 0;

    left: 0;

    width: 6px;

    height: 100%;

    background: var(--color-secondary);

    border-top-left-radius: 22px;

    border-bottom-left-radius: 22px;

}



.ab-leadership .leader-wrapper:nth-child(even) .ab-leader-card::before {

    left: auto;

    right: 0;

    border-radius: 0;

    border-top-right-radius: 22px;

    border-bottom-right-radius: 22px;

}



.ab-leadership .ab-leader-card:hover {

    transform: translateY(-5px);

    box-shadow: 0 20px 40px rgba(12, 26, 25, 0.15);

}



.ab-leadership .ab-leader-card h3 {

    margin-bottom: 1rem;

    font-size: 1.8rem;

    color: var(--color-accent);

    font-family: var(--font-serif, var(--font-display));

}



.ab-leadership .ab-leader-card p {

    color: var(--color-text-muted);

    line-height: 1.7;

    font-size: 1.05rem;

    margin: 0;

}



.ab-projects-zigzag {

    padding: var(--space-section) 6%;

}



.ab-projects-header {

    max-width: 760px;

    margin-bottom: var(--space-lg);

}



.ab-projects-header > p:first-child {

    color: var(--color-secondary);

.ab-projects-header h2 {

}



.ab-projects-subtitle {

.ab-projects-zigzag-list {

}



.ab-projects-zigzag-item {

    grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);

    background: rgba(255, 255, 255, 0.78);

.ab-projects-zigzag-item:nth-child(even) {

}



.ab-projects-zigzag-media {

.ab-projects-zigzag-media img {

    height: 100%;

    object-fit: cover;

    border-radius: 18px;

.ab-projects-zigzag-content {

}



.ab-projects-zigzag-content h3 {

}



.ab-projects-zigzag-content p {

}



.ab-projects-link {

    display: inline-flex;

.ab-projects-link:hover {

.ab-project-row {

.ab-project-image {

.ab-project-image img {

.ab-project-copy h3 {

.ab-cta {

.ab-cta-inner {

.ab-cta p {

.ab-ghost-light {

    border-radius: var(--radius-lg);

.ab-ghost-light:hover {

}



/* Generic reveal animation hooks */

[data-reveal] {

    opacity: 0;

    transition: opacity 0.7s ease, transform 0.7s ease;

    transition-delay: var(--reveal-delay, 0ms);

    will-change: opacity, transform;

}



[data-reveal="fade-down"] {

    transform: translateY(-32px);

}



[data-reveal="fade-up"] {

    transform: translateY(32px);

}



[data-reveal="fade-left"] {

    transform: translateX(32px);

}



[data-reveal="fade-right"] {

    transform: translateX(-32px);

}



[data-reveal="zoom-in"] {

    transform: scale(0.9);

}



[data-reveal="fade-in"] {

    transform: none;

}



[data-reveal].is-revealed {

    opacity: 1;

    transform: none;

}



@media (prefers-reduced-motion: reduce) {

    .ab-floating-image {

        animation: none;

    }



    [data-reveal] {

        opacity: 1;

        transform: none;

        transition: none;

    }



    .ab-leadership .leader-overlay {

        opacity: 1;

        transform: none;

    }

}

        gap: clamp(22px, 3vw, 34px);

        .et-team-section {

            text-transform: uppercase;

            grid-template-columns: repeat(auto-fit, minmax(min(14rem, 100%), 1fr));

            gap: var(--space-md);

            position: relative;

            z-index: 2;

        }



        @media (min-width: 768px) {

            .et-grid {

                gap: 0; /* Tighter grid on desktop for staggered look */

        }



        /* Card Component */

            position: relative;

            cursor: pointer;

            background-color: var(--color-bg-dark);

            /* border-radius: var(--radius-sm); */

            overflow: hidden;

            

            /* Entrance Animation State */

            opacity: 0;

            transform: translateY(30px);

            transition: opacity 0.6s ease-out, transform 0.6s ease-out;

        }



        .et-card.is-visible {

            }

        }



        /* Image Styling */

        .et-card img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            aspect-ratio: 3/4;

            /* filter: grayscale(100%) contrast(1.1); */

            transition: transform 0.6s var(--transition-smooth), filter 0.6s ease;

        }



        /* Gradient Accent Border (Glow) */

        .et-card::before {

            content: '';

            position: absolute;

            top: -2px;

            left: -2px;

            width: 60px;

            height: 80px;

            /* background: linear-gradient(to bottom right, var(--color-secondary), var(--color-primary)); */

            z-index: 10;

            transition: transform 0.4s var(--transition-smooth);

            opacity: 0;

        }



        /* Adjust border position for staggered cards */

        @media (min-width: 768px) {

            .et-card:nth-child(even)::before {

                top: auto;

                bottom: -2px;

                left: -2px;

                background: linear-gradient(to top right, var(--color-primary), var(--color-secondary));

            }

        }



        /* Image Overlay (Dark Glass) */

        .et-card::after {

            content: '';

            position: absolute;

            inset: 0;

            background: linear-gradient(to top, rgba(12, 26, 25, 0.95) 0%, rgba(12, 26, 25, 0.4) 50%, rgba(12, 26, 25, 0.1) 100%);

            z-index: 1;

            opacity: 0.6;

            transition: opacity 0.4s ease;



        }



        /* 

         * CARD CONTENT (Hover Reveal) 

         */

        .et-card-content {

            position: absolute;

            bottom: 0;

            left: 0;

            width: 100%;

            height: 100%;

            z-index: 5;

            padding: var(--space-md);

            display: flex;

            flex-direction: column;

            justify-content: flex-end;

            align-items: center;

            text-align: center;



            /* Hidden State */

            opacity: 0;

            transform: translateY(20px);

            transition: opacity 0.4s ease 0.1s, transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);

        }



        .et-card-content h3 {

            font-family: var(--font-display);

            font-size: var(--fs-h3);

            color: var(--color-text-on-primary);

            margin-bottom: 0.25rem;

            text-transform: capitalize;

            font-weight: 500;

        }



        .et-card-content p {

            font-size: var(--fs-small);

            color: var(--base-gold); /* Gold accent for role */

            text-transform: uppercase;

            letter-spacing: 0.1em;

            margin-bottom: var(--space-md);

        }



        .et-social-links {

            display: flex;

            gap: 1rem;

        }



        .et-social-links a {

            width: 40px;

            height: 40px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.1);

            /* backdrop-filter: blur(4px); */

            display: flex;

            align-items: center;

            justify-content: center;

            color: var(--base-white);

            font-size: 0.9rem;

            border: 1px solid rgba(255, 255, 255, 0.2);

            transition: background 0.3s ease, transform 0.3s ease;

        }



        .et-social-links a:hover {

            background: var(--color-primary);

            border-color: var(--color-primary);

            transform: translateY(-3px);

        }



        /* 

         * HOVER STATES 

         */

        .et-card:hover img {

            filter: grayscale(0%) contrast(1);

            transform: scale(1.05);

        }



        .et-card:hover::after {

            opacity: 1; /* Darken image for text contrast */

        }



        .et-card:hover .et-card-content {

            opacity: 1;

            transform: translateY(0);

        }



        .et-card:hover::before {

            transform: scale(1.1);

            opacity: 1;

        }

   FAQ SECTION (Ethiroli Theme)

   ============================================================ */



/* Section Container */

.et-faq-section {

    padding: var(--space-section) 0;

    background-color: transparent; /* Allows it to blend with page background */

}



/* Main Card */

.et-faq-body {

    width: 100%;

    max-width: 900px; /* Responsive width instead of fixed 70em */

    margin: 0 auto;

    box-shadow: 0 15px 40px rgba(26, 75, 72, 0.1); /* Softer shadow using Teal */

    border-radius: var(--radius-lg);

    padding: 4rem 2rem;

    background-color: #fff;

    position: relative;

    overflow: hidden;

}



/* Decorative Top Border (Clay Color) */

.et-faq-body::before {

    content: '';

    position: absolute;

    top: 0; left: 0; right: 0;

    height: 6px;

    background: var(--color-secondary); /* Clay color */

}



/* Header */

.et-faq-header {

    text-align: center;

    margin-bottom: 3rem;

}



.et-faq-title {

    font-size: 2.5rem;

    margin: 0.4em 0;

    font-family: var(--font-serif);

    color: var(--color-accent); /* Teal */

}



.et-faq-seperator {

    width: 80px;

    background-color: var(--color-secondary); /* Clay color */

    height: 4px;

    margin: 0.5rem auto 0;

    border-radius: 2px;

}



/* List Items */

.et-faq-list > div {

    border-bottom: 1px solid rgba(0,0,0,0.08);

    padding: 1.5em 0em;

}



.et-faq-list > div:last-child {

    border: unset;

}



/* Details/Summary Logic */

details > summary {

    list-style: none;

    outline: none;

}



/* Hide default marker */

details > summary::-webkit-details-marker {

    display: none;

}



summary {

    font-size: 1.2rem;

    font-weight: 600;

    cursor: pointer;

    font-family: var(--font-body);

    color: var(--color-text-main);

    transition: all 0.3s ease;

    position: relative;

    padding-right: 40px; /* Space for the +/- icon */

}



summary:hover {

    color: var(--color-secondary); /* Clay on hover */

}



/* Open State Styling */

details[open] summary ~ * {

    animation: sweep 0.5s ease-in-out;

}



/* The Sweep Animation */

@keyframes sweep {

    0%    { opacity: 0; transform: translateX(-10px); }

    100%  { opacity: 1; transform: translateX(0); }

}



details[open] summary {

    color: var(--color-secondary);

}



/* Content Paragraph */

details[open] p {

    border-left: 3px solid var(--color-secondary);

    margin-left: 2rem; /* Aligned with icon */

    padding-left: 1.5rem;

    margin-top: 1rem;

    opacity: 1;

    color: var(--color-text-muted);

    line-height: 1.7;

    transition: all 0.3s ease;

}



/* Custom +/- Icon Logic */

/* Default Plus Sign */

summary:after {

    background: transparent;

    border-radius: 50%;

    content: "+";

    color: var(--color-secondary);

    float: right;

    font-size: 1.8rem;

    font-weight: 300;

    margin-top: -5px;

    line-height: 1;

    width: 30px;

    text-align: center;

    transition: transform 0.3s ease;

}



/* Open State: Minus Sign */

details[open] summary:after {

    content: "-";

    font-size: 2.2rem;

    margin-top: -10px;

    transform: rotate(180deg); /* Optional: Rotate animation */

}



/* Mobile Responsiveness */

@media (max-width: 768px) {

    .et-faq-body {

        padding: 2rem 1.5rem;

    }

    .et-faq-title {

        font-size: 2rem;

    }

    details[open] p {

        margin-left: 1rem;

        padding-left: 1rem;

    }

}

    font-family: var(--font-display);

}



.glam-heading {

    font-size: clamp(3rem, 8vw, 6rem);

    line-height: 1.05;

    margin-bottom: 1rem;

    color: var(--color-text-on-dark);

}



.hero-content p {

    max-width: 40rem;

    margin: 0 auto 1.75rem;

    color: rgba(255, 255, 255, 0.82);

    font-size: clamp(1rem, 1.2vw + 0.5rem, 1.2rem);

}



.hero-buttons {

    display: flex;

    justify-content: center;

    gap: 1rem;

    flex-wrap: wrap;

}



.btn {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 0.5rem;

    padding: 0.95rem 1.6rem;

    border-radius: 9999px;

    font-weight: 700;

    text-decoration: none;

    transition: transform var(--transition-fast), background-color var(--transition-fast), color var(--transition-fast), box-shadow var(--transition-fast);

}



.btn:hover {

    transform: translateY(-3px);

}



.btn {

    background: var(--color-primary);

    color: var(--color-text-on-primary);

    box-shadow: 0 16px 30px rgba(129, 158, 53, 0.22);

}

.about-section {

    background: linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.88));

      background-image: url('/assets/images/banner/banner.png');

    background-size: cover;

    background-position: center;

}

.about-section .container {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

}

.about-inner div{

    display: flex;

    /* flex-direction: column; */

    align-items: center;

    justify-content: center;

    text-align: center;

}



.btn.btn-outline {

    background: rgba(255, 255, 255, 0.12);

    color: var(--color-text-on-dark);

    border: 1px solid rgba(255, 255, 255, 0.18);

    box-shadow: none;

}



.btn.btn-outline:hover {

    background: rgba(255, 255, 255, 0.18);

}



.partnership-section,

.about-section,

.showcase-section,

.impact-section,

.gallery-section,

.process-section,

.testimonial-section,

.bts-section,

.cta-section {

    padding: clamp(72px, 8vw, 120px) 0;

}



.grid-2 {

    display: grid;

    grid-template-columns: repeat(2, minmax(0, 1fr));

    gap: 2rem;

    align-items: center;

}



.section-tag {

    display: inline-block;

    margin-bottom: 0.75rem;

    font-size: 0.76rem;

    font-weight: 800;

    letter-spacing: 0.14em;

    text-transform: uppercase;

    color: var(--color-primary);

}



.deliverables-list,

.feature-list {

    display: grid;

    gap: 0.8rem;

    margin-top: 1rem;

}



.deliverables-list li,

.feature-list li {

    display: flex;

    align-items: center;

    gap: 0.55rem;

}



.check-icon {

    color: var(--color-primary);

    font-weight: 800;

}



.mockup-wrapper,

.showcase-img,

.gallery-item,

.bts-item {

    border-radius: 1.5rem;

    overflow: hidden;

    box-shadow: 0 20px 45px rgba(26, 75, 72, 0.12);

    transform: translateZ(0);

}



.mockup-wrapper img,

.showcase-img img,

.gallery-item img,

.bts-item img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    transition: transform 0.45s ease;

}



.mockup-wrapper:hover img,

.showcase-img:hover img,

.gallery-item:hover img,

.bts-item:hover img {

    transform: scale(1.05);

}



.about-inner {

    display: grid;

    gap: 1rem;

}



.tags-container {

    display: flex;

    flex-wrap: wrap;

    gap: 0.75rem;

}



.tag {

    padding: 0.55rem 0.9rem;

    border-radius: 9999px;

    background: rgba(129, 158, 53, 0.1);

    color: var(--color-accent);

    font-weight: 700;

}



.showcase-header,

.gallery-header,

.process-header {

    margin-bottom: 2rem;

}



.showcase-block {

    display: grid;

    grid-template-columns: 1.05fr 0.95fr;

    gap: 1.5rem;

    align-items: center;

    margin-bottom: 1.5rem;

}



.showcase-block.reverse {

    grid-template-columns: 0.95fr 1.05fr;

}



.showcase-header + .showcase-block,

.showcase-header + .showcase-block + .showcase-block,

.showcase-header + .showcase-block + .showcase-block + .showcase-block {

    position: relative;

}



.showcase-header + .showcase-block {

    margin-left: 0;

    margin-right: clamp(0rem, 3vw, 2rem);

}



.showcase-header + .showcase-block + .showcase-block {

    grid-template-columns: 0.95fr 1.05fr;

    margin-left: clamp(0rem, 3vw, 2rem);

    margin-right: 0;

}



.showcase-header + .showcase-block + .showcase-block + .showcase-block {

    margin-left: 0;

    margin-right: clamp(0rem, 1.5vw, 1rem);

}



.showcase-text {

    padding: 1.4rem;

    border-radius: 1.5rem;

    /* background: rgba(255, 255, 255, 0.68); */

    /* border: 1px solid rgba(26, 75, 72, 0.08); */

}



.impact-section {

    background: linear-gradient(180deg, rgba(255,255,255,0.3), rgba(255,255,255,0.55));

}



.impact-grid {

    margin-top: 1.5rem;

    display: grid;

    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));

    gap: clamp(1.5rem, 2vw, 2rem);

}



.stat-card {

    position: relative;

    padding: 1.5rem;

    text-align: center;

    border-radius: 1.4rem;

    background: rgba(255,255,255,0.72);

    border: 1px solid rgba(26, 75, 72, 0.08);

    box-shadow: 0 16px 35px rgba(26, 75, 72, 0.08);

}



.stat-number {

    display: block;

    font-family: var(--font-display);

    font-size: clamp(2.4rem, 5vw, 4rem);

    font-weight: 700;

    color: var(--color-primary);

    line-height: 1;

}



.gallery-section {

    background: rgba(255,255,255,0.32);

}



.masonry-grid {

    display: grid;

    grid-template-columns: repeat(3, minmax(0, 1fr));

    gap: 1rem;

}



.gallery-item {

    position: relative;

    min-height: 16rem;

    cursor: pointer;

}



.gallery-item.tall { min-height: 24rem; }

.gallery-item.wide { grid-column: span 2; }



.gallery-overlay {

    position: absolute;

    inset: 0;

    display: grid;

    place-items: center;

    background: linear-gradient(to top, rgba(12,26,25,0.72), transparent);

    color: var(--color-text-on-dark);

    opacity: 0;

    transition: opacity 0.3s ease;

}



.gallery-item:hover .gallery-overlay {

    opacity: 1;

}



.process-wrapper {

    display: grid;

    grid-template-columns: repeat(5, minmax(0, 1fr));

    gap: 1rem;

}



.process-step {

    text-align: center;

    padding: 1rem;

    border-radius: 1.2rem;

    background: rgba(255,255,255,0.7);

    border: 1px solid rgba(26, 75, 72, 0.08);

}



.step-circle {

    width: 3.2rem;

    height: 3.2rem;

    margin: 0 auto 0.8rem;

    border-radius: 9999px;

    display: grid;

    place-items: center;

    background: var(--color-primary);

    color: var(--color-text-on-primary);

    font-weight: 800;

}



.testimonial-section {

    background: linear-gradient(180deg, rgba(129, 158, 53, 0.08), rgba(241, 236, 230, 0.3));

}



.testimonial-section .container {

    text-align: center;

}



.testimonial-quote-mark {

    font-size: 3rem;

    color: var(--color-primary);

    line-height: 1;

}



.testimonial-text {

    max-width: 52rem;

    margin: 1rem auto;

    font-size: clamp(1.1rem, 1.5vw, 1.4rem);

}



.bts-grid {

    display: grid;

    grid-template-columns: repeat(4, minmax(0, 1fr));

    gap: 1rem;

}



.cta-section {

    background:

        /* linear-gradient(135deg, rgba(0,0,0, 0.9), rgba(221, 247, 245, 0.84)), */

        url('/assets/images/banner/banner.png') center/cover no-repeat;

    color: var(--color-text-on-dark);

}



.cta-section .container {

    max-width: 64rem;

    text-align: center;

}



.btn-cta {

    background: var(--base-white);

    color: var(--color-accent);

    box-shadow: 0 16px 34px rgba(0,0,0,0.18);

}



.btn-cta:hover {

    background: rgba(255,255,255,0.92);

}



.et-map-section {

    width: 100%;

    height: 40vh;

    min-height: 260px;

    overflow: hidden;

}



.et-map-frame {

    position: relative;

    width: 100%;

    height: 100%;

    overflow: hidden;

    border-radius: 1.5rem;

    box-shadow: 0 20px 45px rgba(26, 75, 72, 0.12);

}



.et-map-iframe {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    border: 0;

}



.lightbox {

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.9);

    display: grid;

    place-items: center;

    z-index: 2000;

}



.lightbox img {

    max-width: min(92vw, 1100px);

    max-height: 88vh;

    object-fit: contain;

}



@media (max-width: 1100px) {

    .grid-2,

    .showcase-block,

    .showcase-block.reverse {

        grid-template-columns: 1fr;

    }



    .masonry-grid {

        grid-template-columns: repeat(2, minmax(0, 1fr));

    }



    .process-wrapper,

    .bts-grid {

        grid-template-columns: repeat(2, minmax(0, 1fr));

    }

}



@media (max-width: 767px) {

    .hero-section,

    .partnership-section,

    .about-section,

    .showcase-section,

    .impact-section,

    .gallery-section,

    .process-section,

    .testimonial-section,

    .bts-section,

    .cta-section {

        padding-block: 64px;

    }



    .masonry-grid,

    .process-wrapper,

    .bts-grid,

    .grid-2 {

        grid-template-columns: 1fr;

    }



    .gallery-item.wide {

        grid-column: auto;

    }



    .hero-buttons {

        flex-direction: column;

    }



    /* Scoped to the hero on purpose. A bare `.btn` selector turned every

       button in every role portal full width below 768px - including the

       "Open" links in the intern dashboard's task lists, which then stretched

       past their card. */

    .hero-buttons .btn,

    .btn-cta {

        width: 100%;

    }



    .showcase-block,

    .showcase-block.reverse,

    .showcase-block.reveal.active,

    .showcase-block.reverse.reveal.active {

        grid-template-columns: 1fr;

        margin-left: 0;

        margin-right: 0;

    }



    .showcase-block.reverse .showcase-text,

    .showcase-block.reverse .showcase-img {

        order: initial;

    }



    .showcase-header + .showcase-block,

    .showcase-header + .showcase-block + .showcase-block,

    .showcase-header + .showcase-block + .showcase-block + .showcase-block {

        margin-left: 0;

        margin-right: 0;

    }

}



/* ============================================================

   ETHIROLI SERVICE PAGE ÔÇö ROOT BRAND COLOR PATTERN (LIGHT THEME)

   Aligned with About, Home & Projects Design System

   ============================================================ */



.et-srv-page {

    background: var(--color-bg-main, #F1ECE6);

    color: var(--color-text-main, #2D2D2D);

    min-height: 100vh;

    overflow-x: hidden;

    font-family: var(--font-body);

}



.et-srv-container {

    width: min(1380px, calc(100% - 48px));

    margin-inline: auto;

    position: relative;

    z-index: 1;

}



/* Common Text Elements */

.et-srv-badge {

    display: inline-flex;

    align-items: center;

    gap: 0.45rem;

    padding: 0.35rem 0.95rem;

    border: 1px solid rgba(12, 26, 25, 0.12);

    border-radius: 999px;

    color: var(--color-secondary, #AF431E);

    background: rgba(255, 255, 255, 0.65);

    backdrop-filter: blur(10px);

    -webkit-backdrop-filter: blur(10px);

    font-size: 0.76rem;

    font-weight: 700;

    letter-spacing: 0.12em;

    text-transform: uppercase;

    margin-bottom: 0.85rem;

    box-shadow: 0 2px 8px rgba(12, 26, 25, 0.04);

}



.et-srv-badge-star {

    font-size: 0.9rem;

    color: var(--color-secondary, #AF431E);

    display: inline-block;

}



.et-srv-brand-gradient {

    background: linear-gradient(135deg, var(--color-secondary, #AF431E) 0%, #cf4c20 50%, var(--color-primary, #819E35) 100%);

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;

}



.et-srv-section-intro {

    max-width: 28rem;

}



.et-srv-section-title {

    font-family: var(--font-display);

    font-size: clamp(1.85rem, 2.6vw, 2.35rem);

    font-weight: 800;

    color: var(--color-accent, #1A4B48);

    line-height: 1.15;

    margin-bottom: 0.85rem;

    letter-spacing: -0.01em;

}



.et-srv-section-desc {

    font-size: 0.92rem;

    color: var(--color-text-muted, #555555);

    line-height: 1.7;

}



/* Buttons */

.et-srv-btn {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 0.5rem;

    padding: 0.8rem 1.6rem;

    border-radius: var(--radius-lg, 1rem);

    font-size: 0.92rem;

    font-weight: 600;

    text-decoration: none;

    cursor: pointer;

    transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;

}



.et-srv-btn:focus-visible {

    outline: 2.5px solid var(--color-primary, #819E35);

    outline-offset: 3px;

}



.et-srv-btn--primary {

    background: var(--color-secondary, #AF431E);

    color: var(--color-text-on-primary, #ffffff);

    border: none;

    box-shadow: 0 6px 20px rgba(175, 67, 30, 0.25);

}



.et-srv-btn--primary:hover {

    background: var(--color-primary, #819E35);

    color: #ffffff;

    transform: translateY(-2px);

    box-shadow: 0 8px 24px rgba(129, 158, 53, 0.3);

}



.et-srv-btn--outline {

    background: transparent;

    color: var(--color-accent, #1A4B48);

    border: 1.5px solid var(--color-accent, #1A4B48);

}



.et-srv-btn--outline:hover {

    background: var(--color-accent, #1A4B48);

    color: #ffffff;

    transform: translateY(-2px);

    box-shadow: 0 6px 18px rgba(26, 75, 72, 0.2);

}



/* ------------------------------------------------------------

   1. HERO SECTION

   ------------------------------------------------------------ */

.et-srv-hero {

    position: relative;

    min-height: 90vh;

    display: flex;

    align-items: center;

    padding-top: clamp(100px, 12vh, 130px);

    padding-bottom: clamp(60px, 8vh, 85px);

    overflow: hidden;

    background-image: url('/assets/images/banner/banner.png');

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

}



.et-srv-hero::before {

    content: "";

    position: absolute;

    inset: 0;

    background: linear-gradient(180deg, rgba(248, 246, 242, 0.82) 0%, rgba(241, 236, 230, 0.88) 100%);

    pointer-events: none;

    z-index: 1;

}



.et-srv-hero-ambient {

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 1;

    background-image:

        radial-gradient(circle at 14% 18%, rgba(129, 158, 53, 0.14), transparent 45%),

        radial-gradient(circle at 84% 72%, rgba(175, 67, 30, 0.1), transparent 45%);

}



.et-srv-hero-grid {

    position: relative;

    z-index: 2;

    display: grid;

    grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);

    gap: clamp(2rem, 4vw, 3.5rem);

    align-items: center;

}



.et-srv-hero-left {

    max-width: 38rem;

}



.et-srv-hero-title {

    font-family: var(--font-display);

    font-size: clamp(2.3rem, 4.4vw, 3.9rem);

    font-weight: 800;

    line-height: 1.1;

    letter-spacing: -0.02em;

    color: var(--color-accent, #1A4B48);

    margin-bottom: 1.25rem;

}



.et-srv-hero-desc {

    font-size: clamp(0.95rem, 1.05vw, 1.05rem);

    color: var(--color-text-muted, #555555);

    line-height: 1.7;

    margin-bottom: 2rem;

}



.et-srv-hero-actions {

    display: flex;

    align-items: center;

    gap: 1rem;

    flex-wrap: wrap;

    margin-bottom: 2.75rem;

}



.et-srv-feature-pills {

    display: flex;

    align-items: center;

    gap: clamp(1rem, 2vw, 1.75rem);

    flex-wrap: wrap;

    border-top: 1px solid rgba(12, 26, 25, 0.1);

    padding-top: 1.5rem;

}



.et-srv-pill-item {

    display: flex;

    align-items: center;

    gap: 0.7rem;

}



.et-srv-pill-icon {

    width: 2.3rem;

    height: 2.3rem;

    border-radius: 50%;

    background: rgba(129, 158, 53, 0.12);

    border: 1px solid rgba(129, 158, 53, 0.28);

    display: grid;

    place-items: center;

    color: var(--color-primary, #819E35);

}



.et-srv-pill-icon .material-symbols-outlined {

    font-size: 1.2rem;

}



.et-srv-pill-text {

    display: flex;

    flex-direction: column;

    line-height: 1.25;

}



.et-srv-pill-text strong {

    font-size: 0.82rem;

    color: var(--color-accent, #1A4B48);

    font-weight: 700;

}



.et-srv-pill-text span {

    font-size: 0.74rem;

    color: var(--color-text-muted, #555555);

}



/* Hero Right Column */

.et-srv-hero-right {

    position: relative;

    display: flex;

    justify-content: center;

    align-items: center;

}



.et-srv-ambient-aura {

    position: absolute;

    inset: -15%;

    border-radius: 50%;

    background: radial-gradient(circle, rgba(129, 158, 53, 0.22) 0%, rgba(26, 75, 72, 0.16) 45%, transparent 70%);

    filter: blur(48px);

    pointer-events: none;

    z-index: 1;

}



.et-srv-preview-card {

    position: relative;

    z-index: 2;

    width: 100%;

    max-width: 440px;

    background: rgba(255, 255, 255, 0.92);

    backdrop-filter: blur(20px);

    -webkit-backdrop-filter: blur(20px);

    border: 1px solid rgba(26, 75, 72, 0.12);

    border-radius: 18px;

    padding: 1.85rem;

    box-shadow: 0 20px 50px rgba(12, 26, 25, 0.08), 0 4px 16px rgba(129, 158, 53, 0.06);

}



.et-srv-card-tag {

    font-size: 0.74rem;

    font-weight: 700;

    color: var(--color-secondary, #AF431E);

    letter-spacing: 0.06em;

    margin-bottom: 0.35rem;

    text-transform: uppercase;

}



.et-srv-card-title {

    font-family: var(--font-display);

    font-size: 1.3rem;

    font-weight: 800;

    color: var(--color-accent, #1A4B48);

    margin-bottom: 0.3rem;

}



.et-srv-card-subtitle {

    font-size: 0.8rem;

    color: var(--color-text-muted, #555555);

    margin-bottom: 1rem;

    line-height: 1.45;

}



.et-srv-card-tags {

    display: flex;

    flex-wrap: wrap;

    gap: 0.45rem;

    margin-bottom: 1.4rem;

}



.et-srv-card-tags span {

    font-size: 0.72rem;

    padding: 0.22rem 0.65rem;

    border-radius: 5px;

    background: rgba(26, 75, 72, 0.06);

    border: 1px solid rgba(26, 75, 72, 0.12);

    color: var(--color-accent, #1A4B48);

    font-weight: 600;

}



.et-srv-card-stats {

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 0.85rem;

    padding-block: 1.1rem;

    border-top: 1px solid rgba(12, 26, 25, 0.08);

    border-bottom: 1px solid rgba(12, 26, 25, 0.08);

    margin-bottom: 1.25rem;

}



.et-srv-stat-num {

    display: block;

    font-size: 1.35rem;

    font-weight: 800;

    color: var(--color-accent, #1A4B48);

    line-height: 1;

    margin-bottom: 0.3rem;

    font-family: var(--font-display);

}



.et-srv-stat-lbl {

    display: block;

    font-size: 0.7rem;

    color: var(--color-text-muted, #555555);

    line-height: 1.25;

}



.et-srv-card-footer {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 1rem;

}



.et-srv-card-score strong {

    display: block;

    font-size: 0.88rem;

    color: var(--color-accent, #1A4B48);

    font-weight: 700;

}



.et-srv-card-score small {

    display: block;

    font-size: 0.7rem;

    color: var(--color-text-muted, #555555);

}



.et-srv-progress-bar {

    width: 140px;

    height: 6px;

    background: rgba(12, 26, 25, 0.08);

    border-radius: 9999px;

    overflow: hidden;

}



.et-srv-progress-fill {

    width: 82%;

    height: 100%;

    background: linear-gradient(90deg, var(--color-secondary, #AF431E), var(--color-primary, #819E35));

    border-radius: 9999px;

}



.et-srv-floating-code {

    position: absolute;

    right: -18px;

    top: 50%;

    transform: translateY(-50%);

    width: 44px;

    height: 44px;

    border-radius: 12px;

    background: #ffffff;

    border: 1px solid rgba(129, 158, 53, 0.35);

    display: grid;

    place-items: center;

    color: var(--color-primary, #819E35);

    font-weight: 800;

    font-size: 0.95rem;

    box-shadow: 0 8px 24px rgba(12, 26, 25, 0.1);

    z-index: 3;

}



/* ------------------------------------------------------------

   2. CORE DISCIPLINES SECTION

   ------------------------------------------------------------ */

.et-srv-disciplines {

    padding-block: clamp(60px, 8vh, 90px);

    border-top: 1px solid rgba(12, 26, 25, 0.06);

    background: linear-gradient(180deg, #f3eee6 0%, #ece4d7 100%);

.et-srv-discipline-icon {

.et-srv-discipline-info p {

/* ------------------------------------------------------------

   ------------------------------------------------------------ */

.et-srv-journey {

    padding-block: clamp(60px, 8vh, 90px);

    border-top: 1px solid rgba(12, 26, 25, 0.06);

    background: var(--color-bg-main, #F1ECE6);

}



.et-srv-journey-grid {

    display: grid;

    grid-template-columns: 320px 1fr;

    gap: clamp(2rem, 3.5vw, 3.5rem);

}



.et-srv-stats-row {

.et-srv-stat-box {

    border: 1px solid rgba(12, 26, 25, 0.08);

    flex-direction: column;

    align-items: center;

    justify-content: center;

}



.et-srv-stat-box:hover {

    border-color: var(--color-secondary, #AF431E);

    transform: translateY(-3px);

    box-shadow: 0 14px 32px rgba(175, 67, 30, 0.1);

}



.et-srv-stat-box-icon {

    color: var(--color-secondary, #AF431E);

}



.et-srv-stat-box-icon .material-symbols-outlined {

    font-size: 1.6rem;

}



.et-srv-stat-box-val {

    font-family: var(--font-display);

    font-size: 1.65rem;

    font-weight: 800;

    color: var(--color-accent, #1A4B48);

    line-height: 1;

}



.et-srv-stat-box-lbl {

    font-size: 0.72rem;

    color: var(--color-text-muted, #555555);

    line-height: 1.25;

/* ------------------------------------------------------------

   4. PROJECT SHOWCASE SECTION

   ------------------------------------------------------------ */

.et-srv-showcase {

    padding-block: clamp(60px, 8vh, 90px);

    border-top: 1px solid rgba(12, 26, 25, 0.06);

    background: linear-gradient(180deg, #f3eee6 0%, #ece4d7 100%);

}



.et-srv-showcase-header {

    display: flex;

    justify-content: space-between;

    align-items: flex-end;

    gap: 2rem;

    margin-bottom: 2.25rem;

    flex-wrap: wrap;

}



.et-srv-showcase-intro {

    max-width: 32rem;

}



.et-srv-filter-tabs {

    display: flex;

    align-items: center;

    gap: 0.5rem;

    flex-wrap: wrap;

}



.et-srv-filter-tab {

.et-srv-filter-tab:hover {

    background: #ffffff;

    color: var(--color-accent, #1A4B48);
