}



.et-srv-filter-tab:focus-visible {

    outline: 2px solid var(--color-secondary, #AF431E);

    outline-offset: 2px;

}



.et-srv-filter-tab--active {

    background: var(--color-secondary, #AF431E);

    color: #ffffff;

    border-color: var(--color-secondary, #AF431E);

    font-weight: 700;

    box-shadow: 0 4px 14px rgba(175, 67, 30, 0.28);

}



.et-srv-showcase-grid {

    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 1.25rem;

}



.et-srv-showcase-card {

    background: #ffffff;

    border: 1px solid rgba(12, 26, 25, 0.08);

    border-radius: 14px;

    overflow: hidden;

    display: flex;

    flex-direction: column;

    box-shadow: 0 12px 32px rgba(12, 26, 25, 0.06);

    transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;

}



.et-srv-showcase-card:hover {

    transform: translateY(-5px);

    border-color: var(--color-primary, #819E35);

    box-shadow: 0 20px 45px rgba(26, 75, 72, 0.14);

}



.et-srv-card-thumb {

    height: 170px;

    overflow: hidden;

    position: relative;

    margin: 0.65rem 0.65rem 0 0.65rem;

    border-radius: 10px;

}



.et-srv-card-thumb img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    transition: transform 0.5s ease;

}



.et-srv-showcase-card:hover .et-srv-card-thumb img {

    transform: scale(1.05);

}



.et-srv-card-info {

    padding: 1.1rem 1rem 1rem 1rem;

    display: flex;

    flex-direction: column;

    flex-grow: 1;

}



.et-srv-card-name {

    font-family: var(--font-display);

    font-size: 1.02rem;

    font-weight: 700;

    color: var(--color-accent, #1A4B48);

    margin-bottom: 0.2rem;

}



.et-srv-card-sub {

    font-size: 0.78rem;

    color: var(--color-text-muted, #555555);

    margin-bottom: 0.85rem;

}



.et-srv-card-bottom {

    display: flex;

    justify-content: space-between;

    align-items: flex-end;

    gap: 0.5rem;

    margin-top: auto;

    padding-top: 0.75rem;

}



.et-srv-project-tags {

    display: flex;

    gap: 0.35rem;

    flex-wrap: wrap;

}



.et-srv-ptag {

    padding: 0.2rem 0.5rem;

    border-radius: 4px;

    background: rgba(26, 75, 72, 0.05);

    border: 1px solid rgba(26, 75, 72, 0.1);

    font-size: 0.7rem;

    color: var(--color-accent, #1A4B48);

    font-weight: 500;

}



.et-srv-card-arrow {

    width: 2.1rem;

    height: 2.1rem;

    border-radius: 6px;

    background: var(--color-secondary, #AF431E);

    color: #ffffff;

    display: grid;

    place-items: center;

    text-decoration: none;

    flex-shrink: 0;

    transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;

}



.et-srv-card-arrow .material-symbols-outlined {

    font-size: 1.15rem;

    font-weight: 700;

}



.et-srv-card-arrow:hover {

    background: var(--color-primary, #819E35);

    color: #ffffff;

    transform: scale(1.08);

    box-shadow: 0 4px 12px rgba(129, 158, 53, 0.3);

}



/* ------------------------------------------------------------

   5. OUR APPROACH / PROCESS

   ------------------------------------------------------------ */

.et-srv-approach {

    padding-block: clamp(60px, 8vh, 90px);

    border-top: 1px solid rgba(12, 26, 25, 0.06);

    background: var(--color-bg-main, #F1ECE6);

}



.et-srv-approach-grid {

    display: grid;

    grid-template-columns: 310px 1fr;

    gap: clamp(2rem, 3.5vw, 3.5rem);

    align-items: center;

}



.et-srv-approach-steps {

    display: grid;

    grid-template-columns: repeat(5, 1fr);

    gap: 0.75rem;

}



.et-srv-step-node {

    display: flex;

    flex-direction: column;

    align-items: flex-start;

    padding-right: 0.5rem;

}



.et-srv-step-top {

    display: flex;

    align-items: center;

    gap: 0.65rem;

    width: 100%;

    margin-bottom: 0.85rem;

}



.et-srv-step-icon {

    width: 2.75rem;

    height: 2.75rem;

    border-radius: 50%;

    background: rgba(129, 158, 53, 0.12);

    border: 1px solid rgba(129, 158, 53, 0.28);

    display: grid;

    place-items: center;

    color: var(--color-primary, #819E35);

    flex-shrink: 0;

}



.et-srv-step-icon .material-symbols-outlined {

    font-size: 1.35rem;

}



.et-srv-step-arrow {

    color: rgba(129, 158, 53, 0.5);

    font-size: 1.25rem;

    flex-grow: 1;

    text-align: center;

}



.et-srv-step-num {

    font-size: 0.75rem;

    font-weight: 700;

    color: var(--color-secondary, #AF431E);

    margin-bottom: 0.25rem;

}



.et-srv-step-title {

    font-family: var(--font-display);

    font-size: 1rem;

    font-weight: 700;

    color: var(--color-accent, #1A4B48);

    margin-bottom: 0.35rem;

}



.et-srv-step-desc {

    font-size: 0.75rem;

    color: var(--color-text-muted, #555555);

    line-height: 1.45;

}



/* ------------------------------------------------------------

   6. CALL TO ACTION BANNER

   ------------------------------------------------------------ */

.et-srv-cta-section {

    padding-block: clamp(50px, 6vh, 80px);

    background: var(--color-bg-main, #F1ECE6);

}



.et-srv-cta-card {

    position: relative;

    overflow: hidden;

    border-radius: 20px;

    background:

        linear-gradient(120deg, rgba(26, 75, 72, 0.92) 0%, rgba(12, 26, 25, 0.95) 100%),

        url('/assets/images/banner/banner.png') center/cover no-repeat;

    border: 1px solid rgba(255, 255, 255, 0.1);

    padding: clamp(2rem, 3.8vw, 3rem) clamp(2rem, 4.2vw, 3.5rem);

    display: grid;

    grid-template-columns: 1fr 1.3fr;

    gap: 2.5rem;

    align-items: center;

    color: #ffffff;

    box-shadow: 0 24px 60px rgba(12, 26, 25, 0.25);

}



.et-srv-cta-ambient,

.et-srv-cta-ribbon {

    position: absolute;

    right: 0;

    top: 0;

    bottom: 0;

    width: 48%;

    background:

        radial-gradient(circle at 85% 45%, rgba(129, 158, 53, 0.28) 0%, transparent 60%),

        radial-gradient(circle at 95% 10%, rgba(175, 67, 30, 0.22) 0%, transparent 50%);

    pointer-events: none;

    z-index: 1;

}



.et-srv-cta-left {

    position: relative;

    z-index: 2;

}



.et-srv-cta-tag {

    display: block;

    font-size: 0.78rem;

    color: var(--color-primary, #819E35);

    font-weight: 700;

    letter-spacing: 0.1em;

    text-transform: uppercase;

    margin-bottom: 0.4rem;

}



.et-srv-cta-title {

    font-family: var(--font-display);

    font-size: clamp(1.75rem, 2.5vw, 2.3rem);

    font-weight: 800;

    color: #ffffff;

    line-height: 1.2;

}



.et-srv-cta-right {

    position: relative;

    z-index: 2;

}



.et-srv-cta-desc {

    font-size: 0.9rem;

    color: rgba(255, 255, 255, 0.88);

    line-height: 1.65;

    margin-bottom: 1.35rem;

    max-width: 32rem;

}



/* ------------------------------------------------------------

   RESPONSIVE BREAKPOINTS

   ------------------------------------------------------------ */

@media (max-width: 1200px) {

    .et-srv-disciplines-cards {

        grid-template-columns: repeat(2, 1fr);

    }



    .et-srv-stats-row {

        grid-template-columns: repeat(3, 1fr);

    }



    .et-srv-showcase-grid {

        grid-template-columns: repeat(2, 1fr);

    }

}



@media (max-width: 991px) {

    .et-srv-hero-grid,

    .et-srv-disciplines-grid,

    .et-srv-journey-grid,

    .et-srv-approach-grid,

    .et-srv-cta-card {

        grid-template-columns: 1fr;

    }



    .et-srv-section-intro,

    .et-srv-hero-left,

    .et-srv-showcase-intro {

        max-width: 100%;

    }



    .et-srv-approach-steps {

        grid-template-columns: repeat(3, 1fr);

    }



    .et-srv-step-arrow {

        display: none;

    }



    .et-srv-cta-ambient,

    .et-srv-cta-ribbon {

        width: 100%;

        opacity: 0.35;

    }

}



@media (max-width: 767px) {

    .et-srv-container {

        width: min(100%, calc(100% - 32px));

    }



    .et-srv-hero {

        padding-top: 100px;

        padding-bottom: 45px;

    }



    .et-srv-hero-title {

        font-size: 2.2rem;

    }



    .et-srv-feature-pills {

        gap: 1rem;

    }



    .et-srv-preview-card {

        max-width: 100%;

        padding: 1.25rem;

    }



    .et-srv-floating-code {

        display: none;

    }



    .et-srv-disciplines-cards {

        grid-template-columns: 1fr;

    }



    .et-srv-stats-row {

        grid-template-columns: repeat(2, 1fr);

    }



    .et-srv-showcase-grid {

        grid-template-columns: 1fr;

    }



    .et-srv-approach-steps {

        grid-template-columns: 1fr;

    }



    .et-srv-showcase-header {

        flex-direction: column;

        align-items: flex-start;

    }



    .et-srv-cta-card {

        padding: 1.5rem;

    }

}



/* ============================================================

   6. UTILITIES ÔÇö Shared Component Classes

   ============================================================ */



/* Error Boundary */

.error-boundary {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    min-height: 100vh;

    padding: var(--space-lg);

    text-align: center;

    background: var(--color-bg-main);

}



.error-boundary-icon {

    font-size: 4rem;

    color: var(--color-secondary);

    margin-bottom: var(--space-md);

}



.error-boundary-title {

    font-family: var(--font-display);

    font-size: var(--fs-h2);

    color: var(--color-accent);

    margin-bottom: var(--space-sm);

}



.error-boundary-message {

    font-size: var(--fs-body);

    color: var(--color-text-muted);

    max-width: 480px;

    margin-bottom: var(--space-md);

}



.error-boundary-details {

    font-size: var(--fs-small);

    color: var(--color-text-muted);

    background: rgba(0, 0, 0, 0.04);

    padding: 1rem;

    border-radius: var(--radius-md);

    max-width: 640px;

    width: 100%;

    text-align: left;

    white-space: pre-wrap;

    word-break: break-word;

    margin-bottom: var(--space-md);

}



.error-boundary-btn {

    display: inline-block;

    background-color: var(--color-secondary);

    color: var(--color-text-on-primary);

    padding: 0.75rem 2rem;

    border-radius: var(--radius-lg);

    border: none;

    font-weight: 600;

    font-size: 0.95rem;

    cursor: pointer;

    transition: transform var(--transition-fast), background-color var(--transition-fast);

    will-change: transform;

}



.error-boundary-btn:hover {

    background-color: var(--color-primary);

    transform: translateY(-2px);

}



/* Page Loader */

.page-loader {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: var(--space-sm);

}



.page-loader-spinner {

    border-radius: 50%;

    border: 4px solid rgba(26, 75, 72, 0.15);

    border-top-color: var(--color-primary);

    animation: pageLoaderSpin 0.8s linear infinite;

    will-change: transform;

}



.page-loader-spinner[data-size="small"] {

    width: 32px;

    height: 32px;

    border-width: 3px;

}



.page-loader-spinner[data-size="medium"] {

    width: 48px;

    height: 48px;

    border-width: 4px;

}



.page-loader-spinner[data-size="large"] {

    width: 64px;

    height: 64px;

    border-width: 5px;

}



.page-loader-text {

    font-family: var(--font-display);

    font-size: var(--fs-small);

    color: var(--color-text-muted);

    letter-spacing: 0.5px;

}



@keyframes pageLoaderSpin {

    0% { transform: rotate(0deg); }

    100% { transform: rotate(360deg); }

}

  background-color: #6e872b !important;

  color: #ffffff !important;

  box-shadow: 0 4px 14px rgba(129, 158, 53, 0.35) !important;

  transform: translateY(-1px);

}



.btn-outline-primary {

  color: var(--base-olive) !important;

  border-color: var(--base-olive) !important;

  background-color: transparent !important;

  font-weight: 600;

  border-radius: var(--bs-border-radius-sm);

  transition: all 0.25s ease;

}

.btn-outline-primary:hover, .btn-outline-primary:focus, .btn-outline-primary:active {

  background-color: var(--base-olive) !important;

  border-color: var(--base-olive) !important;

  color: #ffffff !important;

  box-shadow: 0 4px 14px rgba(129, 158, 53, 0.25) !important;

  transform: translateY(-1px);

}



.btn-secondary {

  background-color: var(--base-teal) !important;

  border-color: var(--base-teal) !important;

  color: #ffffff !important;

  font-weight: 600;

  border-radius: var(--bs-border-radius-sm);

}

.btn-secondary:hover {

  background-color: #123634 !important;

  border-color: #123634 !important;

  color: #ffffff !important;

}



.btn-outline-secondary {

  color: var(--base-teal) !important;

  border-color: rgba(26, 75, 72, 0.3) !important;

  background-color: transparent !important;

  font-weight: 500;

  border-radius: var(--bs-border-radius-sm);

}

.btn-outline-secondary:hover {

  background-color: rgba(26, 75, 72, 0.08) !important;

  border-color: var(--base-teal) !important;

  color: var(--base-teal) !important;

}



.btn-danger {

  background-color: var(--base-clay) !important;

  border-color: var(--base-clay) !important;

  color: #ffffff !important;

  font-weight: 600;

  border-radius: var(--bs-border-radius-sm);

}

.btn-danger:hover {

  background-color: #923718 !important;

  border-color: #923718 !important;

}



.btn-outline-danger {

  color: var(--base-clay) !important;

  border-color: rgba(175, 67, 30, 0.4) !important;

  background-color: transparent !important;

  border-radius: var(--bs-border-radius-sm);

}

.btn-outline-danger:hover {

  background-color: var(--base-clay) !important;

  border-color: var(--base-clay) !important;

  color: #ffffff !important;

}



/* Card Theming */

.card {

  background-color: var(--color-surface) !important;

  border: 1px solid rgba(26, 75, 72, 0.12) !important;

  border-radius: var(--radius-md, 0.75rem) !important;

  box-shadow: 0 4px 20px rgba(26, 75, 72, 0.05) !important;

  transition: transform 0.25s ease, box-shadow 0.25s ease;

}

.card:hover {

  box-shadow: 0 8px 30px rgba(26, 75, 72, 0.09) !important;

}



/* Stat Card Left Borders */

.border-primary { border-color: var(--base-olive) !important; }

.border-success { border-color: var(--base-olive) !important; }

.border-info { border-color: var(--base-teal) !important; }

.border-danger { border-color: var(--base-clay) !important; }

.border-warning { border-color: var(--base-gold) !important; }

.border-dark { border-color: var(--base-dark) !important; }



/* Text Utility Colors */

.text-primary { color: var(--base-olive) !important; }

.text-secondary { color: var(--color-text-muted) !important; }

.text-success { color: var(--base-olive) !important; }

.text-info { color: var(--base-teal) !important; }

.text-danger { color: var(--base-clay) !important; }

.text-warning { color: #9e7500 !important; }

.text-dark { color: #2D2D2D !important; }

.text-muted { color: #666666 !important; }



/* Background Utility Overrides */

.bg-primary {

  background-color: var(--base-olive) !important;

  color: #ffffff !important;

}

.bg-primary.bg-opacity-10, .bg-primary.bg-opacity-25, .bg-primary-subtle {

  background-color: rgba(129, 158, 53, 0.12) !important;

  color: var(--base-olive) !important;

}

.bg-success.bg-opacity-10, .bg-success-subtle {

  background-color: rgba(129, 158, 53, 0.12) !important;

  color: var(--base-olive) !important;

}

.bg-info.bg-opacity-10, .bg-info-subtle {

  background-color: rgba(26, 75, 72, 0.12) !important;

  color: var(--base-teal) !important;

}

.bg-danger.bg-opacity-10, .bg-danger-subtle {

  background-color: rgba(175, 67, 30, 0.12) !important;

  color: var(--base-clay) !important;

}

.bg-warning.bg-opacity-10, .bg-warning-subtle {

  background-color: rgba(232, 214, 87, 0.22) !important;

  color: #7d6000 !important;

}

.bg-secondary.bg-opacity-10, .bg-secondary-subtle {

  background-color: rgba(26, 75, 72, 0.08) !important;

  color: var(--base-teal) !important;

}



/* Badge Styling */

.badge {

  font-family: var(--font-body);

  font-weight: 600;

  letter-spacing: 0.02em;

  padding: 0.35em 0.65em;

  border-radius: 9999px;

}

.badge.bg-primary {

  background-color: var(--base-olive) !important;

  color: #ffffff !important;

}

.badge.bg-light {

  background-color: rgba(26, 75, 72, 0.06) !important;

  color: var(--color-accent) !important;

  border: 1px solid rgba(26, 75, 72, 0.12) !important;

}

.badge.bg-success {

  background-color: rgba(129, 158, 53, 0.16) !important;

  color: #52671f !important;

  border: 1px solid rgba(129, 158, 53, 0.3) !important;

}

.badge.bg-danger {

  background-color: rgba(175, 67, 30, 0.14) !important;

  color: var(--base-clay) !important;

  border: 1px solid rgba(175, 67, 30, 0.3) !important;

}

.badge.bg-warning {

  background-color: rgba(232, 214, 87, 0.25) !important;

  color: #755a00 !important;

  border: 1px solid rgba(232, 214, 87, 0.5) !important;

}

.badge.bg-info {

  background-color: rgba(26, 75, 72, 0.14) !important;

  color: var(--base-teal) !important;

  border: 1px solid rgba(26, 75, 72, 0.25) !important;

}



/* Table Styling */

.table {

  --bs-table-bg: var(--color-surface);

  --bs-table-color: var(--color-text-main);

  --bs-table-hover-bg: rgba(129, 158, 53, 0.05);

  --bs-table-border-color: rgba(26, 75, 72, 0.08);

  font-family: var(--font-body);

  border-collapse: separate;

  border-spacing: 0;

  width: 100%;

}

.table thead th {

  background-color: rgba(26, 75, 72, 0.05) !important;

  color: var(--color-accent) !important;

  font-weight: 700;

  font-size: 0.78rem;

  text-transform: uppercase;

  letter-spacing: 0.05em;

  padding: 12px 16px;

  border-bottom: 2px solid rgba(26, 75, 72, 0.14) !important;

}

.table tbody td {

  padding: 8px 12px;

  vertical-align: middle;

  border-bottom: 1px solid rgba(26, 75, 72, 0.06);

  font-size: 0.88rem;

}

.table-responsive {

  overflow-x: auto;

  -webkit-overflow-scrolling: touch;

  border-radius: var(--radius-md);

  border: 1px solid rgba(26, 75, 72, 0.1);

  background: var(--color-surface);

}



/* Form Controls */

.form-control, .form-select {

  border: 1px solid rgba(26, 75, 72, 0.18) !important;

  border-radius: var(--bs-border-radius-sm) !important;

  padding: 6px 10px;

  font-size: 0.9rem;

  color: var(--color-text-main) !important;

  background-color: #ffffff !important;

  transition: border-color 0.2s ease, box-shadow 0.2s ease;

}

.form-control:focus, .form-select:focus {

  border-color: var(--base-olive) !important;

  box-shadow: 0 0 0 3px rgba(129, 158, 53, 0.2) !important;

  outline: none;

}

.form-label {

  font-size: 0.82rem;

  font-weight: 600;

  color: var(--color-accent);

  margin-bottom: 6px;

}



/* Modals */

.modal-content {

  border-radius: var(--radius-lg, 1rem) !important;

  border: 1px solid rgba(26, 75, 72, 0.15) !important;

  box-shadow: 0 20px 60px rgba(12, 26, 25, 0.3) !important;

}

.modal-header {

  background-color: rgba(26, 75, 72, 0.04);

  border-bottom: 1px solid rgba(26, 75, 72, 0.1);

  padding: 18px 24px;

}

.modal-title {

  font-weight: 700;

  color: var(--color-accent);

  font-size: 1.15rem;

}

.modal-body {

  padding: 24px;

}

.modal-footer {

  background-color: rgba(26, 75, 72, 0.02);

  border-top: 1px solid rgba(26, 75, 72, 0.1);

  padding: 16px 24px;

}



/* Alerts */

.alert {

  border-radius: var(--bs-border-radius-sm);

  font-size: 0.88rem;

  border: 1px solid transparent;

}

.alert-success {

  background-color: rgba(129, 158, 53, 0.12) !important;

  border-color: rgba(129, 158, 53, 0.3) !important;

  color: #435418 !important;

}

.alert-danger {

  background-color: rgba(175, 67, 30, 0.12) !important;

  border-color: rgba(175, 67, 30, 0.3) !important;

  color: var(--base-clay) !important;

}

.alert-warning {

  background-color: rgba(232, 214, 87, 0.2) !important;

  border-color: rgba(232, 214, 87, 0.4) !important;

  color: #695100 !important;

}

.alert-info {

  background-color: rgba(26, 75, 72, 0.1) !important;

  border-color: rgba(26, 75, 72, 0.25) !important;

  color: var(--base-teal) !important;

}



/* ============================================================

   PORTAL LAYOUT FRAMEWORK

   ============================================================ */

.layoutContainer {

  display: flex;

  min-height: 100vh;

  width: 100%;

  background-color: var(--color-bg-main);

  position: relative;

}



.mainWrapper {

  flex: 1;

  display: flex;

  flex-direction: column;

  min-width: 0;

  background-color: var(--color-bg-main);

  transition: all var(--transition-fast);

}



.contentArea {

  display: flex;

  flex: 1;

  position: relative;

  overflow: hidden;

}



.mainContent {

  flex: 1;

  padding: var(--space-sm) var(--space-md);

  overflow-y: auto;

  min-width: 0;

}



@media (max-width: 768px) {

  .mainContent {

    padding: var(--space-sm) var(--space-md);

  }

}



/* ============================================================

   FLEX UTILITIES

   ============================================================ */

/* Bootstrap ships no min-width utilities, so `min-w-0` was a no-op class

   outside the employee portal (the only definition of it lived under

   .emp-portal). Without it a flex child keeps the default `min-width: auto`

   and refuses to shrink below its content, so long labels push sibling

   buttons straight out of their card on narrow screens. */

.min-w-0 {

  min-width: 0;

}



/* ============================================================

   PROGRESS BARS

   ============================================================ */

/* Bootstrap's default track is an opaque grey slab, which reads as a heavy

   block beside a label - and near-black against a dark card. Making the track

   transparent lets the surface behind it show through instead, and rounds the

   fill to match. Height is deliberately untouched so no portal's existing

   sizing shifts; a portal wanting a slimmer bar sets its own height.

   !important is required because these elements carry inline

   `style={{ height: '6px' }}` and Bootstrap declares the track background. */

.progress {

  background-color: transparent !important;

  border-radius: 999px;

}



.progress-bar {

  border-radius: 999px;

}



/* ============================================================

   ACTIVITY FEED SLIDE-OVER DRAWER

   ============================================================ */

.activityFeedTray {

  position: fixed;

  top: 0;

  right: -380px;

  width: 360px;

  height: 100vh;

  background: var(--color-surface);

  border-left: 1px solid var(--admin-border);

  box-shadow: -8px 0 32px rgba(26, 75, 72, 0.15);

  z-index: 1050;

  display: flex;

  flex-direction: column;

  transition: right var(--transition-smooth);

}



.activityFeedTray.open {

  right: 0;

}



.feedHeader {

  padding: 20px 24px;

  border-bottom: 1px solid var(--admin-border);

  display: flex;

  align-items: center;

  justify-content: space-between;

  background: rgba(26, 75, 72, 0.03);

}



.feedHeader h3 {

  font-size: 16px;

  font-weight: 700;

  color: var(--color-accent);

  margin: 0;

}



.feedBody {

  flex: 1;

  padding: 16px;

  overflow-y: auto;

  display: flex;

  flex-direction: column;

  gap: 12px;

}



.feedItem {

  background: #fdfbf7;

  border: 1px solid var(--admin-border-light);

  border-radius: var(--radius-sm);

  padding: 12px 14px;

  transition: transform var(--transition-fast), border-color var(--transition-fast);

}



.feedItem:hover {

  border-color: var(--color-primary);

  transform: translateX(-2px);

}



.feedItem.unreadItem {

  border-left: 4px solid var(--color-primary);

  background: #ffffff;

}



.feedText {

  font-size: 13px;

  color: var(--color-text-main);

  margin: 0 0 6px 0;

  line-height: 1.4;

}



.feedTime {

  font-size: 11px;

  color: var(--color-text-muted);

}



.readBtn {

  font-size: 11px;

  color: var(--color-primary);

  background: none;

  border: none;

  padding: 0;

  margin-top: 4px;

  cursor: pointer;

  font-weight: 600;

}



.readBtn:hover {

  text-decoration: underline;

}



/* Clickable feed row (employee portal only). The class is only applied when the

   signed-in role is EMPLOYEE, so no other portal's tray changes. */

.feedItem--clickable {

  cursor: pointer;

}



.feedItem--clickable:focus-visible {

  outline: 2px solid var(--color-primary);

  outline-offset: 2px;

}



/* ---- Activity Feed item detail dialog (employee portal) ---- */



.feedDetailBackdrop {

  position: fixed;

  inset: 0;

  z-index: 1070;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 20px;

  background: rgba(12, 26, 25, 0.55);

  backdrop-filter: blur(3px);

}



.feedDetailModal {

  width: 100%;

  max-width: 520px;

  max-height: 88vh;

  display: flex;

  flex-direction: column;

  background: #ffffff;

  border-radius: 16px;

  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);

  overflow: hidden;

}



.feedDetailHead {

  display: flex;

  align-items: flex-start;

  gap: 12px;

  padding: 18px 20px 14px;

  background: var(--admin-bg-light, #f7f4ee);

  border-bottom: 1px solid var(--admin-border-light);

}



.feedDetailIcon {

  display: flex;

  align-items: center;

  justify-content: center;

  width: 40px;

  height: 40px;

  flex-shrink: 0;

  border-radius: 12px;

  font-size: 18px;

  background: rgba(129, 158, 53, 0.16);

  color: var(--color-primary);

}



.feedDetailHeadText {

  flex: 1;

  min-width: 0;

}



.feedDetailTitle {

  margin: 0;

  font-size: 15px;

  font-weight: 700;

  color: var(--admin-text-primary, #1e293b);

}



.feedDetailSub {

  font-size: 12px;

  color: var(--admin-text-secondary, #64748b);

}



.feedDetailBody {

  padding: 18px 20px;

  overflow-y: auto;

}



.feedDetailMessage {

  margin: 0 0 16px;

  padding: 12px 14px;

  border-radius: 10px;

  background: var(--admin-bg-light, #f7f4ee);

  font-size: 13.5px;

  line-height: 1.6;

  color: var(--admin-text-primary, #1e293b);

  overflow-wrap: anywhere;

}



.feedDetailList {

  margin: 0;

}



.feedDetailRow {

  display: grid;

  grid-template-columns: 130px 1fr;

  gap: 6px 14px;

  padding: 7px 0;

  border-bottom: 1px dashed var(--admin-border-light);

}



.feedDetailRow:last-child {

  border-bottom: 0;

}



.feedDetailRow dt {

  font-size: 12.5px;

  font-weight: 600;

  color: var(--admin-text-secondary, #64748b);

  margin: 0;

}



.feedDetailRow dd {

  font-size: 13px;

  color: var(--admin-text-primary, #1e293b);

  margin: 0;

  overflow-wrap: anywhere;

}



.feedDetailActions {

  display: flex;

  justify-content: flex-end;

  gap: 8px;

  padding: 12px 20px;

  border-top: 1px solid var(--admin-border-light);

}



@media (max-width: 576px) {

  .feedDetailRow {

    grid-template-columns: 1fr;

    gap: 2px;

  }

}



.feedBackdrop {

  position: fixed;

  inset: 0;

  background: var(--overlay-color);

  backdrop-filter: blur(4px);

  z-index: 1040;

}



/* ============================================================

   TOP NAVBAR (PORTAL)

   ============================================================ */

.portalNavbar {

  height: 64px;

  background: var(--color-surface);

  border-bottom: 1px solid var(--admin-border);

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 0 24px;

  position: sticky;

  top: 0;

  z-index: 1000;

  box-shadow: 0 2px 8px rgba(26, 75, 72, 0.04);

}



.portalNavbarBrand {

  display: flex;

  align-items: center;

  gap: 12px;

  min-width: 0;

  flex-shrink: 1;

}



/* The icon/action cluster on the right. Without min-width:0 the flex item

   refuses to shrink below its content width and pushes the navbar wider than

   the viewport on narrow screens, giving the page a horizontal scrollbar. */

.portalNavbarActions {

  display: flex;

  align-items: center;

  gap: 12px;

  min-width: 0;

  flex-shrink: 0;

}



/* Narrow screens: trim the navbar chrome rather than let it overflow. The role

   badge is decorative (the same role is spelled out in the user pill), and the

   search pill collapses to its icon, both already have title/aria labels. */

@media (max-width: 640px) {

  .portalNavbar {

    padding: 0 12px;

  }

  .portalNavbarBrand {

    gap: 8px;

  }

  .portalRoleBadge {

    display: none;

  }

  .portalNavbarActions {

    gap: 6px;

  }

  .portalSearchPill {

    padding: 6px 10px;

    gap: 0;

  }

}



@media (max-width: 400px) {

  .portalBrandTitle {

    font-size: 13px;

    letter-spacing: 0.04em;

  }

  /* Only the avatar survives - the search pill and the secondary

     bell/chat/help icons move into the sidebar drawer. */

  .portalSearchPill,

  .portalNavbarActions .portalNotificationBtn {

    display: none;

  }

}



.portalSidebarToggle {

  background: transparent;

  border: 1px solid var(--admin-border);

  border-radius: var(--radius-sm);

  width: 36px;

  height: 36px;

  display: flex;

  align-items: center;

  justify-content: center;

  color: var(--color-accent);

  cursor: pointer;

  transition: all var(--transition-fast);

}



.portalSidebarToggle:hover {

  background: rgba(26, 75, 72, 0.05);

  border-color: var(--color-primary);

  color: var(--color-primary);

}



.portalBrandTitle {

  font-size: 15px;

  font-weight: 800;

  letter-spacing: 0.08em;

  color: var(--color-accent);

  text-decoration: none;

}



.portalRoleBadge {

  font-size: 11px;

  font-weight: 700;

  text-transform: uppercase;

  letter-spacing: 0.04em;

  padding: 3px 10px;

  border-radius: 9999px;

  background: rgba(129, 158, 53, 0.14);

  color: var(--base-olive);

  border: 1px solid rgba(129, 158, 53, 0.3);

}



.portalSearchPill {

  display: flex;

  align-items: center;

  gap: 8px;

  background: var(--color-bg-main);

  border: 1px solid var(--admin-border);

  border-radius: var(--radius-md);

  padding: 6px 14px;

  font-size: 13px;

  color: var(--color-text-muted);

  cursor: pointer;

  transition: all var(--transition-fast);

}



.portalSearchPill:hover {

  border-color: var(--color-primary);

  background: #ffffff;

}



.portalSearchPill kbd {

  background: #ffffff;

  border: 1px solid var(--admin-border);

  border-radius: 4px;

  padding: 1px 6px;

  font-size: 10px;

  color: var(--color-text-muted);

}



.portalNotificationBtn {

  position: relative;

  width: 38px;

  height: 38px;

  border-radius: 50%;

  border: 1px solid var(--admin-border);

  background: var(--color-surface);

  color: var(--color-accent);

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 16px;

  cursor: pointer;

  transition: all var(--transition-fast);

}



.portalNotificationBtn:hover {

  border-color: var(--color-primary);

  color: var(--color-primary);

  background: rgba(129, 158, 53, 0.08);

}



.portalNotificationBadge {

  position: absolute;

  top: -2px;

  right: -2px;

  background: var(--color-secondary);

  color: #ffffff;

  font-size: 10px;

  font-weight: 700;

  min-width: 18px;

  height: 18px;

  border-radius: 9999px;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 0 4px;

  border: 2px solid var(--color-surface);

}



.portalRoleSelect {

  background: var(--color-bg-main);

  border: 1px solid var(--admin-border);

  color: var(--color-accent);

  font-size: 12px;

  font-weight: 600;

  padding: 6px 12px;

  border-radius: var(--radius-sm);

  outline: none;

  cursor: pointer;

  transition: border-color var(--transition-fast);

}



.portalRoleSelect:focus {

  border-color: var(--color-primary);

}



.portalUserPill {

  display: flex;

  align-items: center;

  gap: 10px;

  padding: 4px 8px;

  border-radius: var(--radius-md);

}



.portalAvatar {

  width: 34px;

  height: 34px;

  border-radius: 50%;

  background: linear-gradient(135deg, var(--base-olive), var(--base-teal));

  color: #ffffff;

  font-weight: 700;

  font-size: 13px;

  display: flex;

  align-items: center;

  justify-content: center;

  box-shadow: 0 2px 6px rgba(26, 75, 72, 0.2);

  overflow: hidden;

  flex-shrink: 0;

}



.portalAvatarImg {

  width: 100%;

  height: 100%;

  border-radius: 50%;

  object-fit: cover;

  display: block;

}



.portalLogoutBtn {

  background: transparent;

  border: 1px solid rgba(175, 67, 30, 0.3);

  color: var(--base-clay);

  font-size: 12px;

  font-weight: 600;

  padding: 6px 12px;

  border-radius: var(--radius-sm);

  cursor: pointer;

  display: flex;

  align-items: center;

  gap: 6px;

  from { opacity: 0; }

  outline-offset: 2px;

}

/* ============================ PRINT ============================

   "Print Payslip" calls window.print(). Without print rules that printed the

   entire portal - sidebar, header, the payslip table and every other card. These

   rules isolate the payslip: everything is hidden except the elements marked

   .emp-printable inside the open modal.



   Scoped to .emp-portal so no other portal's print behaviour changes. */



@media print {

  .emp-portal body,

  .emp-portal .portalSidebar,

  .emp-portal .sidebar,

  .emp-portal .navbar,

  .emp-portal .topbar,

  .emp-portal .pageHeader,

  .emp-portal .emp-print-hide {

    display: none !important;

  }



  /* Unpin the modal from its fixed overlay so it flows onto the page. */

  .emp-portal .modal.show.d-block {

    position: static !important;

    background: none !important;

    display: block !important;

  }



  .emp-portal .modal-dialog {

    max-width: none !important;

    margin: 0 !important;

  }



  .emp-portal .modal-content {

    border: 0 !important;

    box-shadow: none !important;

  }



  .emp-portal .emp-printable {

    display: block !important;

  }



  /* Print the currency symbol and table rules reliably across browsers. */

  .emp-portal .table {

    color: #000 !important;

  }

}

/* =============================================================================

   EMPLOYEE PORTAL ÔÇö Design System & Motion Layer

   -----------------------------------------------------------------------------

   Scoped entirely under `.emp-portal` so it can never leak into the Intern /

   HR / Finance / Student portals that other teams are working on.



   Brand tokens are inherited from the company design system

   (--color-primary olive #819E35, --base-gold #E8D657, --base-clay #AF431E,

   --base-teal #1A4B48, --color-bg-main cream #F1ECE6) so the Employee portal

   stays on-brand.



   Motion language intentionally mirrors the existing `premium-motion.css`

   (fade + rise + stagger) for consistency across the product.

   ========================================================================== */



.emp-portal {

  /* --- Local tokens (scoped, so no global leakage) --- */

  --emp-radius-sm: 10px;

  --emp-radius: 16px;

  --emp-radius-lg: 22px;



  --emp-shadow-xs: 0 1px 2px rgba(26, 75, 72, 0.05);

  --emp-shadow-sm: 0 2px 10px rgba(26, 75, 72, 0.06);

  --emp-shadow: 0 8px 26px rgba(26, 75, 72, 0.08);

  --emp-shadow-lg: 0 18px 48px rgba(26, 75, 72, 0.14);



  --emp-ring: 0 0 0 3px rgba(129, 158, 53, 0.28);



  /* Tone ramp used by stat cards / accents */

  --emp-olive: #819e35;

  --emp-olive-dark: #6e872b;

  --emp-gold: #e8d657;

  --emp-clay: #af431e;

  --emp-teal: #1a4b48;



  --emp-ease: cubic-bezier(0.22, 0.8, 0.22, 1);

  --emp-ease-out: cubic-bezier(0.16, 1, 0.3, 1);

  --emp-dur: 0.42s;



  position: relative;

}



/* ============================ PAGE HEADER ============================ */



.emp-portal .pageTitle {

  letter-spacing: -0.02em;

  line-height: 1.15;

  background: linear-gradient(120deg, var(--emp-teal) 0%, var(--emp-olive-dark) 100%);

  -webkit-background-clip: text;

  background-clip: text;

  -webkit-text-fill-color: transparent;

}



.emp-portal .pageSubtitle {

  max-width: 68ch;

}



/* ============================ CARDS ============================ */



.emp-portal .card {

  border: 1px solid rgba(26, 75, 72, 0.08);

  border-radius: var(--emp-radius);

  box-shadow: var(--emp-shadow-sm);

  transition:

    transform var(--emp-dur) var(--emp-ease),

    box-shadow var(--emp-dur) var(--emp-ease),

    border-color var(--emp-dur) var(--emp-ease);

  position: relative;

  overflow: hidden;

}



/* Soft brand wash that appears on hover */

.emp-portal .card::after {

  content: "";

  position: absolute;

  inset: 0;

  pointer-events: none;

  opacity: 0;

  background:

    radial-gradient(120% 90% at 50% -20%, rgba(129, 158, 53, 0.10), transparent 60%);

  transition: opacity var(--emp-dur) var(--emp-ease);

}



.emp-portal .card:hover {

  transform: translateY(-3px);

  box-shadow: var(--emp-shadow);

  border-color: rgba(129, 158, 53, 0.28);

}



.emp-portal .card:hover::after {

  opacity: 1;

}



/* Tinted header strip (Attendance / Task cards use .bg-light) */

.emp-portal .card-header {

  background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(241, 236, 230, 0.45));

  border-bottom: 1px solid rgba(26, 75, 72, 0.07);

  font-weight: 700;

  letter-spacing: -0.01em;

}



.emp-portal .card-body {

  position: relative;

  z-index: 1;

}



/* ============================ STAT / KPI CARDS ============================ */



.emp-portal .emp-stat {

  position: relative;

  border-radius: var(--emp-radius);

  padding: 1.1rem 1.15rem;

  background: var(--color-surface, #fff);

  border: 1px solid rgba(26, 75, 72, 0.08);

  box-shadow: var(--emp-shadow-sm);

  overflow: hidden;

  transition:

    transform var(--emp-dur) var(--emp-ease),

    box-shadow var(--emp-dur) var(--emp-ease);

}



/* brand accent rail */

.emp-portal .emp-stat::before {

  content: "";

  position: absolute;

  inset: 0 auto 0 0;

  width: 4px;

  background: var(--stat-tone, var(--emp-olive));

  transform-origin: top;

  transform: scaleY(0.35);

  opacity: 0.85;

  transition: transform var(--emp-dur) var(--emp-ease-out);

}



.emp-portal .emp-stat:hover {

  transform: translateY(-3px);

  box-shadow: var(--emp-shadow);

}



.emp-portal .emp-stat:hover::before {

  transform: scaleY(1);

}



.emp-portal .emp-stat__label {

  font-size: 0.7rem;

  font-weight: 700;

  letter-spacing: 0.08em;

  text-transform: uppercase;

  color: var(--color-text-muted, #555);

  margin-bottom: 0.35rem;

}



.emp-portal .emp-stat__value {

  font-size: 1.6rem;

  font-weight: 700;

  line-height: 1.1;

  color: var(--emp-teal);

  font-variant-numeric: tabular-nums;

}



.emp-portal .emp-stat__hint {

  font-size: 0.75rem;

  color: var(--color-text-muted, #555);

  margin-top: 0.2rem;

}



/* Tone variants */

.emp-portal .emp-stat--olive { --stat-tone: var(--emp-olive); }

.emp-portal .emp-stat--gold  { --stat-tone: var(--emp-gold); }

.emp-portal .emp-stat--clay  { --stat-tone: var(--emp-clay); }

.emp-portal .emp-stat--teal  { --stat-tone: var(--emp-teal); }



/* Shared employee-style live punch clock used by HR and Manager as well. */

.emp-portal .emp-live-clock {

  overflow: hidden;

  border: 1px solid rgba(26, 75, 72, 0.10);

  border-radius: 14px;

  background: #fff;

  box-shadow: 0 8px 24px rgba(26, 75, 72, 0.07) !important;

}

.emp-portal .emp-live-clock .card-body { padding: 1.25rem; }

.emp-portal .emp-live-clock__head { display:flex; align-items:center; gap: .9rem; }

.emp-portal .emp-live-clock__icon { display:flex; width:52px; height:52px; flex:0 0 52px; align-items:center; justify-content:center; border-radius:50%; background:#eff3e5; color:#829f2d; font-size:1.45rem; }

.emp-portal .emp-live-clock__title { margin:0 0 .15rem; color:#1a4b48; font-size:1.2rem; font-weight:700; }

.emp-portal .emp-live-clock__date { color:#60716e; font-size:.88rem; }

.emp-portal .emp-live-clock__date strong { color:#233d39; }

.emp-portal .emp-live-clock__badge { margin-left:auto; padding:.3rem .65rem; border-radius:999px; font-size:.68rem; font-weight:800; letter-spacing:.04em; white-space:nowrap; }

.emp-portal .emp-live-clock__badge.is-present { color:#315416; background:#dfeabd; }

.emp-portal .emp-live-clock__badge.is-idle { color:#66716e; background:#edf0ef; }

.emp-portal .emp-live-clock__body { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-top:1rem; padding: .85rem 0; border-top:1px solid #e2e9e7; border-bottom:1px solid #e2e9e7; }

.emp-portal .emp-live-clock__stats { display:flex; flex-wrap:wrap; gap:1.5rem; }

.emp-portal .emp-live-clock__stats div { display:grid; gap:.15rem; }

.emp-portal .emp-live-clock__stats span { color:#687977; font-size:.82rem; }

.emp-portal .emp-live-clock__stats strong { color:#243b38; font-size:.93rem; }

.emp-portal .emp-live-clock__stats strong.is-green { color:#77982b; font-family:monospace; }

.emp-portal .emp-live-clock__action { min-width:140px; border:1px solid; border-radius:10px; font-weight:700; }

.emp-portal .emp-live-clock__action.is-in { color:#fff; border-color:#829f2d; background:#829f2d; }

.emp-portal .emp-live-clock__action.is-out { color:#c74b2d; border-color:#efa28f; background:#fff; }

.emp-portal .emp-live-clock__sessions { padding-top:.85rem; }

.emp-portal .emp-live-clock__sessions h3 { margin:0 0 .65rem; color:#52615e; font-size:.78rem; font-weight:800; text-transform:uppercase; }

.emp-portal .emp-live-clock__session { display:flex; align-items:center; gap:.7rem; padding:.45rem 0; color:#324541; font-size:.85rem; }

.emp-portal .emp-live-clock__session-number { padding:.15rem .5rem; border:1px solid #d7e0de; border-radius:999px; background:#f6f8f7; font-size:.7rem; text-transform:uppercase; }

.emp-portal .emp-live-clock__session strong { margin-left:auto; color:#54751d; font-size:.68rem; }

.emp-portal .emp-attendance-note { border:1px solid rgba(26,75,72,.1); border-radius:12px; }

@media (max-width: 767px) {

  .emp-portal .emp-live-clock__body { align-items:stretch; flex-direction:column; }

  .emp-portal .emp-live-clock__stats { gap:.8rem 1.25rem; }

  .emp-portal .emp-live-clock__action { width:100%; }

  .emp-portal .emp-live-clock__badge { margin-left:auto; }

}



/* ============================ BUTTONS ============================ */



.emp-portal .btn {

  border-radius: 10px;

  font-weight: 600;

  letter-spacing: 0.01em;

  position: relative;

  overflow: hidden;

  transition:

    transform 0.18s var(--emp-ease-out),

    box-shadow 0.18s var(--emp-ease-out),

    background-color 0.18s var(--emp-ease),

    border-color 0.18s var(--emp-ease),

    color 0.18s var(--emp-ease);

}



.emp-portal .btn:not(:disabled):hover {

  transform: translateY(-1px);

}



.emp-portal .btn:not(:disabled):active {

  transform: translateY(0) scale(0.985);

}



.emp-portal .btn:focus-visible {

  outline: none;

  box-shadow: var(--emp-ring);

}



/* Shine sweep on primary actions */

.emp-portal .btn-primary {

  background: linear-gradient(135deg, var(--emp-olive) 0%, var(--emp-olive-dark) 100%);

  border: 1px solid transparent;

  color: #fff;

  box-shadow: 0 6px 16px rgba(129, 158, 53, 0.28);

}



.emp-portal .btn-primary:not(:disabled):hover {

  box-shadow: 0 10px 24px rgba(129, 158, 53, 0.36);

}



.emp-portal .btn-primary::before {

  content: "";

  position: absolute;

  inset: 0;

  background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, 0.35) 50%, transparent 70%);

  transform: translateX(-120%);

  transition: transform 0.75s var(--emp-ease-out);

}



.emp-portal .btn-primary:not(:disabled):hover::before {

  transform: translateX(120%);

}



.emp-portal .btn-outline-danger {

  border-color: rgba(175, 67, 30, 0.45);

  color: var(--emp-clay);

}



.emp-portal .btn-outline-danger:not(:disabled):hover {

  background: var(--emp-clay);

  border-color: var(--emp-clay);

  color: #fff;

  box-shadow: 0 8px 20px rgba(175, 67, 30, 0.28);

}



.emp-portal .btn-outline-primary {

  border-color: rgba(26, 75, 72, 0.28);

  color: var(--emp-teal);

}



.emp-portal .btn-outline-primary:not(:disabled):hover {

  background: var(--emp-teal);

  border-color: var(--emp-teal);

  color: #fff;

}



.emp-portal .btn:disabled {

  opacity: 0.55;

  transform: none !important;

}



/* ============================ TABLES ============================ */



.emp-portal .table {

  margin-bottom: 0;

}



.emp-portal .table > :not(caption) > * > * {

  padding: 0.85rem 0.9rem;

  border-bottom-color: rgba(26, 75, 72, 0.07);

}



.emp-portal .table thead th {

  font-size: 0.68rem;

  font-weight: 700;

  letter-spacing: 0.08em;

  text-transform: uppercase;

  color: var(--color-text-muted, #555);

  background: rgba(241, 236, 230, 0.55);

  border-bottom: 1px solid rgba(26, 75, 72, 0.1);

  white-space: nowrap;

  position: sticky;

  top: 0;

  z-index: 2;

}



.emp-portal .table-hover > tbody > tr {

  transition: background-color 0.22s var(--emp-ease);

}



.emp-portal .table-hover > tbody > tr:hover > * {

  background-color: rgba(129, 158, 53, 0.06);

  color: inherit;

}



.emp-portal .table tbody tr:last-child > * {

  border-bottom-width: 0;

}



/* ============================ BADGES ============================ */



.emp-portal .badge {

  font-weight: 600;

  letter-spacing: 0.02em;

  border-radius: 999px;

  padding-inline: 0.65em;

}



.emp-portal .badge.bg-success {

  background: linear-gradient(135deg, var(--emp-olive) 0%, var(--emp-olive-dark) 100%) !important;

  color: #fff;

}



.emp-portal .badge.bg-primary {

  background: linear-gradient(135deg, var(--emp-teal) 0%, #123432 100%) !important;

  color: #fff;

}



.emp-portal .badge.bg-danger {

  background: linear-gradient(135deg, var(--emp-clay) 0%, #8c3214 100%) !important;

  color: #fff;

}



.emp-portal .badge.bg-warning,

.emp-portal .badge.bg-warning.text-dark {

  background: linear-gradient(135deg, var(--emp-gold) 0%, #d4bf3f 100%) !important;

  color: #3b3407;

}



.emp-portal .badge.bg-info {

  background: linear-gradient(135deg, #2f7d78 0%, var(--emp-teal) 100%) !important;

  color: #fff;

}



/* ============================ FORMS ============================ */



.emp-portal .form-control,

.emp-portal .form-select {

  border-radius: 10px;

  border-color: rgba(26, 75, 72, 0.16);

  padding: 0.6rem 0.85rem;

  transition:

    border-color 0.2s var(--emp-ease),

    box-shadow 0.2s var(--emp-ease),

    background-color 0.2s var(--emp-ease);

}



.emp-portal .form-control:focus,

.emp-portal .form-select:focus {

  border-color: var(--emp-olive);

  box-shadow: var(--emp-ring);

}



.emp-portal .form-control:disabled {

  background: rgba(241, 236, 230, 0.7);

  color: var(--color-text-muted, #555);

}



.emp-portal .form-label {

  font-size: 0.82rem;

  font-weight: 600;

  color: var(--emp-teal);

  margin-bottom: 0.35rem;

}



.emp-portal .form-check-input {

  border-color: rgba(26, 75, 72, 0.3);

  cursor: pointer;

}



.emp-portal .form-check-input:checked {

  background-color: var(--emp-olive);

  border-color: var(--emp-olive);

}



/* ============================ MODALS ============================ */



.emp-portal .modal-content {

  border: none;

  border-radius: var(--emp-radius-lg);

  box-shadow: var(--emp-shadow-lg);

  overflow: hidden;

}



.emp-portal .modal-header {

  border-bottom: 1px solid rgba(26, 75, 72, 0.08);

  background: linear-gradient(135deg, rgba(129, 158, 53, 0.1), rgba(26, 75, 72, 0.06));

  padding: 1rem 1.25rem;

}



.emp-portal .modal-title {

  font-weight: 700;

  color: var(--emp-teal);

  letter-spacing: -0.01em;

}



.emp-portal .modal-body {

  padding: 1.25rem;

}



.emp-portal .modal-footer {

  border-top: 1px solid rgba(26, 75, 72, 0.08);

  padding: 0.9rem 1.25rem;

  background: rgba(241, 236, 230, 0.4);

}



/* ============================ ALERTS ============================ */



.emp-portal .alert {

  border: none;

  border-radius: var(--emp-radius-sm);

  border-left: 4px solid transparent;

  box-shadow: var(--emp-shadow-xs);

  font-size: 0.9rem;

}



.emp-portal .alert-success {

  background: rgba(129, 158, 53, 0.1);

  color: #4d5c1e;

  border-left-color: var(--emp-olive);

}



.emp-portal .alert-danger {

  background: rgba(175, 67, 30, 0.1);

  color: #7c2a12;

  border-left-color: var(--emp-clay);

}



.emp-portal .alert-warning {

  background: rgba(232, 214, 87, 0.18);

  color: #5f5310;

  border-left-color: var(--emp-gold);

}



.emp-portal .alert-info {

  background: rgba(26, 75, 72, 0.09);

  color: #143836;

  border-left-color: var(--emp-teal);

}



/* ============================ PROGRESS / MISC ============================ */



.emp-portal .progress {

  background: rgba(26, 75, 72, 0.09);

  border-radius: 999px;

}



.emp-portal .progress-bar {

  background: linear-gradient(90deg, var(--emp-olive), var(--emp-gold));

  transition: width 0.7s var(--emp-ease-out);

}



.emp-portal code {

  color: var(--emp-teal);

  background: rgba(26, 75, 72, 0.07);

  border-radius: 5px;

  padding: 0.1rem 0.35rem;

}



.emp-portal a {

  color: var(--emp-olive-dark);

  transition: color 0.18s var(--emp-ease);

}



.emp-portal a:hover {

  color: var(--emp-olive);

}



/* ============================ DETAIL MODAL ============================

   Shared "click a row to see the full record" dialog. Scoped to .emp-portal so

   no other portal's modal styling is affected. */



.emp-portal .emp-modal-backdrop {

  position: fixed;

  inset: 0;

  z-index: 1055;

  display: flex;

  align-items: flex-start;

  justify-content: center;

  padding: 1.5rem 1rem;

  overflow-y: auto;

  background: rgba(15, 27, 26, 0.55);

  backdrop-filter: blur(3px);

  animation: emp-fade-in 0.18s var(--emp-ease-out);

}



.emp-portal .emp-modal-backdrop .modal-dialog {

  margin: auto;

  animation: emp-modal-rise 0.24s var(--emp-ease-out);

}



.emp-portal .emp-detail__header {

  display: flex;

  align-items: flex-start;

  gap: 0.875rem;

  background: var(--color-bg-main, #f1ece6);

  border-bottom: 1px solid rgba(26, 75, 72, 0.1);

  padding: 1.125rem 1.25rem;

}



.emp-portal .emp-detail__icon {

  display: flex;

  align-items: center;

  justify-content: center;

  width: 44px;

  height: 44px;

  flex-shrink: 0;

  border-radius: 14px;

  font-size: 1.25rem;

  background: rgba(129, 158, 53, 0.14);

  color: var(--emp-olive-dark);

}



.emp-portal .emp-detail__icon--success { background: rgba(34, 139, 94, 0.14); color: #1f7a52; }

.emp-portal .emp-detail__icon--danger  { background: rgba(196, 62, 46, 0.14);  color: #b23b2c; }

.emp-portal .emp-detail__icon--warning { background: rgba(201, 148, 26, 0.16); color: #a4740f; }

.emp-portal .emp-detail__icon--info    { background: rgba(58, 106, 196, 0.14); color: #2f5da8; }

.emp-portal .emp-detail__icon--teal    { background: rgba(26, 75, 72, 0.12);   color: var(--emp-teal); }



.emp-portal .emp-detail__title {

  font-size: 1.1rem;

  font-weight: 700;

  color: var(--emp-teal);

  margin: 0;

}



.emp-portal .emp-detail__subtitle {

  font-size: 0.83rem;

  color: #6b7a78;

  margin-top: 2px;

}



.emp-portal .emp-detail__badge {

  align-self: center;

  flex-shrink: 0;

  font-weight: 600;

  letter-spacing: 0.01em;

  padding: 0.4em 0.75em;

}



.emp-portal .emp-detail__body {

  padding: 1.25rem;

  background: #fff;

}



.emp-portal .emp-detail__section + .emp-detail__section {

  margin-top: 1.5rem;

  padding-top: 1.25rem;

  border-top: 1px solid rgba(26, 75, 72, 0.09);

}



.emp-portal .emp-detail__section-title {

  font-size: 0.74rem;

  font-weight: 700;

  letter-spacing: 0.09em;

  text-transform: uppercase;

  color: #6b7a78;

  margin-bottom: 0.75rem;

}



.emp-portal .emp-detail__row {

  display: grid;

  grid-template-columns: minmax(120px, 34%) 1fr;

  gap: 0.5rem 1rem;

  padding: 0.5rem 0;

  border-bottom: 1px dashed rgba(26, 75, 72, 0.08);

}



.emp-portal .emp-detail__row:last-child { border-bottom: 0; }



.emp-portal .emp-detail__label {

  font-size: 0.8rem;

  font-weight: 600;

  color: #6b7a78;

  margin: 0;

}



.emp-portal .emp-detail__value {

  font-size: 0.9rem;

  color: #1f2d2c;

  margin: 0;

  overflow-wrap: anywhere;

}



.emp-portal .emp-detail__prose {

  font-size: 0.92rem;

  line-height: 1.65;

  color: #1f2d2c;

  white-space: pre-wrap;

  overflow-wrap: anywhere;

  background: var(--color-bg-main, #f1ece6);

  border-radius: var(--emp-radius-sm);

  padding: 0.9rem 1rem;

}



.emp-portal .min-w-0 { min-width: 0; }



/* ============================ PROJECT CARDS ============================ */



.emp-portal .emp-project-card {

  cursor: pointer;

  transition: transform 0.22s var(--emp-ease-out), box-shadow 0.22s var(--emp-ease-out);

}



.emp-portal .emp-project-card:hover,

.emp-portal .emp-project-card:focus-visible {

  transform: translateY(-3px);

  box-shadow: var(--emp-shadow);

}



.emp-portal .emp-project-card__desc {

  /* Clamp so a long description cannot make one card tower over the rest; the

     full text is available in the detail dialog. */

  display: -webkit-box;

  -webkit-line-clamp: 3;

  line-clamp: 3;

  -webkit-box-orient: vertical;

  overflow: hidden;

}



.emp-portal .emp-repo-tree {

  font-size: 0.86rem;

  background: var(--color-bg-main, #f1ece6);

  border-radius: var(--emp-radius-sm);

  padding: 0.9rem 1rem;

  max-height: 260px;

  overflow-y: auto;

}



.emp-portal .emp-repo-tree__item {

  padding: 0.15rem 0;

  color: #33413f;

}



.emp-portal .emp-repo-tree__item .bi-folder-fill { color: var(--emp-gold); }

.emp-portal .emp-repo-tree__item .bi-file-earmark { color: #8c9a98; }



/* Placeholder banner for a course with no thumbnail. */

.emp-portal .emp-course-banner {

  height: 150px;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 2.25rem;

  color: rgba(255, 255, 255, 0.55);

  background: linear-gradient(135deg, var(--emp-teal) 0%, #2c6b66 55%, var(--emp-olive-dark) 100%);

}



/* Circular overall-progress gauge on the Training page. */

.emp-portal .emp-ring-stat {

  display: flex;

  align-items: center;

  justify-content: center;

  width: 62px;

  height: 62px;

  flex-shrink: 0;

  border-radius: 50%;

  position: relative;

}



.emp-portal .emp-ring-stat::after {

  content: '';

  position: absolute;

  inset: 6px;

  background: #fff;

  border-radius: 50%;

}



.emp-portal .emp-ring-stat span {

  position: relative;

  z-index: 1;

  font-size: 0.82rem;

  font-weight: 700;

  color: var(--emp-teal);

}



/* Long text in a table cell: clamp to two lines, full text in the detail dialog. */

.emp-portal .emp-clamp-cell {

  display: -webkit-box;

  -webkit-line-clamp: 2;

  line-clamp: 2;

  -webkit-box-orient: vertical;

  overflow: hidden;

  max-width: 340px;

}



/* ============================ LEAVE DECISIONS ============================ */



.emp-portal .emp-decision {

  border-radius: var(--emp-radius-sm);

  padding: 0.8rem 0.95rem;

  border: 1px solid transparent;

}



.emp-portal .emp-decision--approved {

  background: rgba(34, 139, 94, 0.08);

  border-color: rgba(34, 139, 94, 0.28);

}



.emp-portal .emp-decision--rejected {

  background: rgba(196, 62, 46, 0.08);

  border-color: rgba(196, 62, 46, 0.26);

}



.emp-portal .emp-decision--pending {

  background: rgba(201, 148, 26, 0.09);

  border-color: rgba(201, 148, 26, 0.28);

}



.emp-portal .emp-decision__by {

  font-size: 0.78rem;

  color: #4a5a58;

  margin-top: 0.15rem;

}



/* ============================ MESSAGE BUBBLES ============================ */



.emp-portal .emp-msg {

  max-width: 78%;

  padding: 0.7rem 0.95rem;

  border-radius: 16px;

  font-size: 0.9rem;

  line-height: 1.55;

  box-shadow: var(--emp-shadow-xs);

  overflow-wrap: anywhere;

  white-space: pre-wrap;

  cursor: pointer;

  transition: transform 0.16s var(--emp-ease-out), box-shadow 0.16s var(--emp-ease-out);

}



.emp-portal .emp-msg:hover {

  transform: translateY(-1px);

  box-shadow: var(--emp-shadow-sm);

}



.emp-portal .emp-msg--mine {

  background: var(--emp-teal);

  color: #fff;

  border-bottom-right-radius: 5px;

}



.emp-portal .emp-msg--theirs {

  background: #fff;

  color: #1f2d2c;

  border: 1px solid rgba(26, 75, 72, 0.1);

  border-bottom-left-radius: 5px;

}



.emp-portal .emp-msg__meta {

  display: flex;

  align-items: baseline;

  gap: 0.5rem;

  margin-bottom: 0.3rem;

  font-size: 0.76rem;

}



.emp-portal .emp-msg__author { font-weight: 600; color: var(--emp-teal); }

.emp-portal .emp-msg__time { color: #6b7a78; }



.emp-portal .emp-msg--mine .emp-msg__author { color: #fff; }

.emp-portal .emp-msg--mine .emp-msg__time { color: rgba(255, 255, 255, 0.7); }



.emp-portal .emp-msg__hint {

  display: inline-flex;

  align-items: center;

  gap: 0.25rem;

  margin-top: 0.4rem;

  font-size: 0.68rem;

  opacity: 0.65;

}



/* ============================ LOGIN / RECOVERY ============================ */



.emp-portal .emp-linkish {

  background: none;

  border: 0;

  padding: 0;

  font: inherit;

  color: var(--emp-olive-dark);

  font-weight: 600;

  text-decoration: underline;

  text-underline-offset: 3px;

  cursor: pointer;

}



.emp-portal .emp-linkish:hover { color: var(--emp-teal); }



.emp-portal .emp-step {

  display: flex;

  gap: 0.6rem;

  align-items: flex-start;

  padding: 0.7rem 0.85rem;

  border-radius: var(--emp-radius-sm);

  background: #fff;

  border: 1px solid rgba(26, 75, 72, 0.1);

}



.emp-portal .emp-step + .emp-step { margin-top: 0.5rem; }



.emp-portal .emp-step--done { border-color: rgba(34, 139, 94, 0.35); background: rgba(34, 139, 94, 0.06); }

.emp-portal .emp-step--active { border-color: var(--emp-olive); background: rgba(129, 158, 53, 0.07); }

.emp-portal .emp-step--todo { opacity: 0.65; }



.emp-portal .emp-step__num {

  display: flex;

  align-items: center;

  justify-content: center;

  width: 26px;

  height: 26px;

  flex-shrink: 0;

  border-radius: 50%;

  font-size: 0.78rem;

  font-weight: 700;

  background: rgba(26, 75, 72, 0.1);

  color: var(--emp-teal);

}



.emp-portal .emp-step--done .emp-step__num { background: #228b5e; color: #fff; }

.emp-portal .emp-step--active .emp-step__num { background: var(--emp-olive); color: #fff; }



/* Rows that open a detail dialog read as interactive. */

.emp-portal .emp-row-clickable { cursor: pointer; }

.emp-portal .emp-row-clickable:focus-visible {

  outline: 2px solid var(--emp-olive);

  outline-offset: -2px;

}



@keyframes emp-fade-in {

  from { opacity: 0; }

  to   { opacity: 1; }

}



@keyframes emp-modal-rise {

  from { opacity: 0; transform: translateY(14px) scale(0.985); }

  to   { opacity: 1; transform: none; }

}



@media (max-width: 576px) {

  .emp-portal .emp-detail__row {

    grid-template-columns: 1fr;

    gap: 0.15rem;

  }

}



/* ============================ EMPTY STATE ============================ */



.emp-portal .emp-empty {

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  gap: 0.5rem;

  padding: 2.75rem 1.25rem;

  text-align: center;

}



.emp-portal .emp-empty__icon {

  width: 74px;

  height: 74px;

  border-radius: 22px;

  display: grid;

  place-items: center;

  font-size: 2rem;

  color: var(--emp-olive);

  background: linear-gradient(135deg, rgba(129, 158, 53, 0.16), rgba(232, 214, 87, 0.16));

  box-shadow: inset 0 0 0 1px rgba(129, 158, 53, 0.18);

}



.emp-portal .emp-empty__title {

  font-weight: 700;

  color: var(--emp-teal);

  margin: 0.35rem 0 0;

}



.emp-portal .emp-empty__text {

  color: var(--color-text-muted, #555);

  font-size: 0.88rem;

  max-width: 46ch;

  margin: 0;

}



/* ============================ NAV HUB (Dashboard) ============================ */



.emp-portal .emp-hub-card {

  height: 100%;

  border-radius: var(--emp-radius);

  background: linear-gradient(160deg, rgba(255, 255, 255, 0.95), rgba(241, 236, 230, 0.5));

  transition:

    transform var(--emp-dur) var(--emp-ease),

    box-shadow var(--emp-dur) var(--emp-ease);

}



.emp-portal .emp-hub-card:hover {

  transform: translateY(-3px);

  box-shadow: var(--emp-shadow);

}



.emp-portal .emp-hub-card a {

  display: block;

  padding: 0.4rem 0.6rem;

  border-radius: 8px;

  color: var(--color-text-muted, #555);

  font-size: 0.85rem;

  transition:

    background-color 0.2s var(--emp-ease),

    color 0.2s var(--emp-ease),

    transform 0.2s var(--emp-ease-out);

}



.emp-portal .emp-hub-card a:hover {

  background: rgba(129, 158, 53, 0.1);

  color: var(--emp-teal);

  transform: translateX(3px);

}



/* ============================ MESSAGE / CHAT ============================ */



.emp-portal .list-group-item {

  transition: background-color 0.2s var(--emp-ease);

}



.emp-portal .message-bubble {

  border-radius: 14px;

  animation: empBubbleIn 0.35s var(--emp-ease-out) both;

  white-space: pre-wrap;

  word-break: break-word;

}



@keyframes empBubbleIn {

  from { opacity: 0; transform: translateY(8px) scale(0.98); }

  to   { opacity: 1; transform: translateY(0) scale(1); }

}



/* ============================ MOTION ============================ */



@keyframes empRiseIn {

  from { opacity: 0; transform: translate3d(0, 18px, 0); }

  to   { opacity: 1; transform: translate3d(0, 0, 0); }

}



@keyframes empRiseInLeft {

  from { opacity: 0; transform: translate3d(-14px, 0, 0); }

  to   { opacity: 1; transform: translate3d(0, 0, 0); }

}



@keyframes empPopIn {

  0%   { opacity: 0; transform: scale(0.94); }

  100% { opacity: 1; transform: scale(1); }

}



@keyframes empSheen {

  from { background-position: 200% 0; }

  to   { background-position: -200% 0; }

}



@keyframes empSpin {

  to { transform: rotate(360deg); }

}



/* Applied by <Reveal> */

.emp-portal .emp-reveal {

  opacity: 0;

  animation: empRiseIn 0.62s var(--emp-ease-out) both;

  animation-delay: var(--emp-delay, 0ms);

}



.emp-portal .emp-reveal-left {

  opacity: 0;

  animation: empRiseInLeft 0.55s var(--emp-ease-out) both;

  animation-delay: var(--emp-delay, 0ms);

}



/* Modal entrance */

.emp-portal .modal.show .modal-dialog {

  animation: empPopIn 0.28s var(--emp-ease-out) both;

}



/* Live "running session" pulse */

.emp-portal .emp-live-dot {

  display: inline-block;

  width: 8px;

  height: 8px;

  border-radius: 50%;

  background: var(--emp-olive);

  box-shadow: 0 0 0 0 rgba(129, 158, 53, 0.6);

  animation: empPulse 1.9s infinite;

}



@keyframes empPulse {

  0%   { box-shadow: 0 0 0 0 rgba(129, 158, 53, 0.55); }

  70%  { box-shadow: 0 0 0 9px rgba(129, 158, 53, 0); }

  100% { box-shadow: 0 0 0 0 rgba(129, 158, 53, 0); }

}



.emp-portal .spinner-border {

  animation: empSpin 0.7s linear infinite;

}



/* Skeleton shimmer (Employee-scoped) */

.emp-portal .emp-skeleton {

  border-radius: var(--emp-radius-sm);

  background: linear-gradient(

    90deg,

    rgba(26, 75, 72, 0.06) 25%,

    rgba(241, 236, 230, 0.75) 50%,

    rgba(26, 75, 72, 0.06) 75%

  );

  background-size: 200% 100%;

  animation: empSheen 1.4s infinite linear;

}



/* Numeric emphasis */

.emp-portal .font-monospace {

  font-variant-numeric: tabular-nums;

  letter-spacing: -0.01em;

}



/* ============================ RESPONSIVE ============================ */



@media (max-width: 992px) {

  .emp-portal .emp-stat__value { font-size: 1.4rem; }

}



@media (max-width: 768px) {

  .emp-portal .pageTitle { font-size: 1.4rem !important; }



  .emp-portal .card:hover { transform: none; }



  .emp-portal .table > :not(caption) > * > * {

    padding: 0.7rem 0.65rem;

  }
